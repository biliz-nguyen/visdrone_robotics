name: YOLOEdge27 Paper Ablation C1 C2 50e

on:
  push:
    branches:
      - research/yoloedge27-paper-ablation-c1-c2-50e
    paths:
      - '.github/workflows/yoloedge27-paper-ablation-c1-c2-50e.yml'
      - 'scripts/run_paper_ablation_phase_50e.py'
      - 'scripts/compare_paper_ablation_50e.py'
      - 'src/model_builder.py'
      - 'src/config.py'
      - 'scripts/train.py'
      - 'scripts/eval_screening.py'
      - 'scripts/export.py'
  workflow_dispatch:

concurrency:
  group: yoloedge27-paper-ablation-c1-c2-50e
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paper-ablation-50e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 1440
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage24/paper_ablation_c1_c2_50e
      REPORT_DIR: reports/yoloedge27/stage24/paper_ablation_c1_c2_50e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout paper ablation branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-paper-ablation-c1-c2-50e
          fetch-depth: 0

      - name: Verify paper ablation scope
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          grep -q 'ultralytics_tag: "v8.4.56"' config/experiment.yaml
          grep -q 'edge27_place_b0:' config/experiment.yaml
          grep -q 'edge27_spr_p4p5:' config/experiment.yaml
          grep -q 'edge27_head_direct_r1:' config/experiment.yaml
          grep -q 'edge27_neck_realloc_v2:' config/experiment.yaml
          grep -q 'p4: 416' config/experiment.yaml
          grep -q 'a0_baseline' scripts/run_paper_ablation_phase_50e.py
          grep -q 'a1_spr' scripts/run_paper_ablation_phase_50e.py
          grep -q 'a2_spr_r1' scripts/run_paper_ablation_phase_50e.py
          grep -q 'a3_final_n2b' scripts/run_paper_ablation_phase_50e.py
          grep -q 'AConv=false C12=false' scripts/run_paper_ablation_phase_50e.py
          "$PYTHON_BIN" -m py_compile \
            scripts/run_paper_ablation_phase_50e.py \
            scripts/compare_paper_ablation_50e.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/bootstrap/runs"
          state_dir: "$SCREEN_ROOT/bootstrap/state"
          outputs_dir: "$SCREEN_ROOT/bootstrap/outputs"
          generated_dir: "$SCREEN_ROOT/bootstrap/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_neck_realloc.py

      - name: Preflight all four paper variants before training
        shell: bash
        run: |
          set -euo pipefail
          for VARIANT in a0_baseline a1_spr a2_spr_r1 a3_final_n2b; do
            echo "=== PREFLIGHT $VARIANT ==="
            "$PYTHON_BIN" scripts/run_paper_ablation_phase_50e.py \
              --variant "$VARIANT" \
              --dataset "$DATASET" \
              --screen-root "$SCREEN_ROOT" \
              --report-dir "$REPORT_DIR" \
              --epochs 50 \
              --batch 8 \
              --nbs 16 \
              --workers 4 \
              --preflight-only
          done

      - name: Train A0 baseline Conv standard-neck reg16 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_50e.py \
            --variant a0_baseline \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 50 --batch 8 --nbs 16 --workers 4

      - name: Train A1 plus SPR 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_50e.py \
            --variant a1_spr \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 50 --batch 8 --nbs 16 --workers 4

      - name: Train A2 plus direct reg1 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_50e.py \
            --variant a2_spr_r1 \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 50 --batch 8 --nbs 16 --workers 4

      - name: Train A3 final plus N2b neck reallocation 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_50e.py \
            --variant a3_final_n2b \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 50 --batch 8 --nbs 16 --workers 4

      - name: Build paper ablation summary
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/compare_paper_ablation_50e.py --report-dir "$REPORT_DIR"

      - name: Commit compact paper ablation reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-paper-ablation-c1-c2-50e"
            echo "head=$(git rev-parse HEAD)"
            echo "paper_scope=C1_SPR+C2_neck_reallocation"
            echo "AConv=false"
            echo "C12=false"
            echo "design=sequential_one_factor_per_row"
            echo "A0=Conv_standard_neck_reg16"
            echo "A1=A0_plus_SPR_P4_P5"
            echo "A2=A1_plus_direct_reg1"
            echo "A3=A2_plus_N2b_reallocation_160_256_416"
            echo "epochs_each=50"
            echo "seed=42"
            echo "pretrained=false"
            echo "assigner=stock_TAL"
            echo "loss=stock_v8DetectionLoss"
            echo "test_dev_used=false"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          rm -f config/local.yaml
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No paper ablation report changes to commit"
            exit 0
          fi
          git commit -m "Record full C1 C2 paper ablation 50e"
          git pull --rebase origin research/yoloedge27-paper-ablation-c1-c2-50e
          git push origin HEAD:research/yoloedge27-paper-ablation-c1-c2-50e
