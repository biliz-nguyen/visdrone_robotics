name: VisDrone Smoke Train

on:
  push:
    branches:
      - setup/gpu-runner-test
    paths-ignore:
      - diagnostics/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-train:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run self-diagnosing smoke train
        shell: bash
        run: |
          set +e
          main() {
            set -euo pipefail

            echo "=== HOST / GPU ==="
            hostname
            nvidia-smi

            echo "=== PRE-FLIGHT CUDA ==="
            "$PYTHON_BIN" -c "import torch; print('Torch:', torch.__version__); print('Torch CUDA:', torch.version.cuda); print('CUDA available:', torch.cuda.is_available()); print('Device count:', torch.cuda.device_count()); assert torch.cuda.is_available(), 'CUDA unavailable before setup'; print('GPU:', torch.cuda.get_device_name(0))"

            echo "=== LOCAL DATASET ==="
            DATASET=/home/minh/Desktop/project/visdrone_local_project/dataset
            test -d "$DATASET/train/images"
            test -d "$DATASET/train/labels"
            test -d "$DATASET/valid/images"
            test -d "$DATASET/valid/labels"
            echo "train images: $(find "$DATASET/train/images" -maxdepth 1 -type f | wc -l)"
            echo "valid images: $(find "$DATASET/valid/images" -maxdepth 1 -type f | wc -l)"

            cat > config/local.yaml <<'EOF'
          dataset_root: "/home/minh/Desktop/project/visdrone_local_project/dataset"
          train_images: "train/images"
          val_images: "valid/images"
          test_images: "test/images"
          test_image: ""
          EOF

            echo "=== SETUP ==="
            PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

            echo "=== POST-SETUP CUDA ==="
            "$PYTHON_BIN" -c "import torch; print('Torch:', torch.__version__); print('Torch CUDA:', torch.version.cuda); print('CUDA available:', torch.cuda.is_available()); print('Device count:', torch.cuda.device_count()); assert torch.cuda.is_available(), 'CUDA unavailable after setup'; print('GPU:', torch.cuda.get_device_name(0))"

            echo "=== FORCE 1-EPOCH SMOKE CONFIG ==="
            "$PYTHON_BIN" -c "from pathlib import Path; import yaml; p=Path('config/experiment.yaml'); c=yaml.safe_load(p.read_text()); c['preset']='reg4_eca'; c['train']['epochs']=1; c['train']['save_period']=1; c['train']['patience']=0; p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8'); print(p.read_text())"

            echo "=== SANITY ==="
            "$PYTHON_BIN" scripts/sanity.py

            echo "=== TRAIN 1 EPOCH ==="
            "$PYTHON_BIN" scripts/train.py

            echo "=== OUTPUTS ==="
            find runs -maxdepth 3 -type f \( -name 'results.csv' -o -name 'args.yaml' -o -name 'best.pt' -o -name 'last.pt' \) -printf '%p %k KB\n' 2>/dev/null | tail -40 || true
            find state -maxdepth 1 -type f -name '*.json' -print -exec cat {} \; 2>/dev/null || true
          }

          main > >(tee smoke_debug.log) 2>&1
          rc=$?
          echo "$rc" > smoke_exit_code.txt
          echo "SMOKE_EXIT_CODE=$rc"
          exit 0

      - name: Save diagnostic log to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp smoke_debug.log diagnostics/smoke_debug.log
          cp smoke_exit_code.txt diagnostics/smoke_exit_code.txt
          git config user.name "visdrone-runner"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/smoke_debug.log diagnostics/smoke_exit_code.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update smoke training diagnostics"
            git push origin HEAD:setup/gpu-runner-test
          fi

      - name: Fail job if smoke train failed
        shell: bash
        run: |
          rc=$(cat smoke_exit_code.txt)
          if [ "$rc" -ne 0 ]; then
            echo "Smoke train failed with exit code $rc. See diagnostics/smoke_debug.log"
            exit "$rc"
          fi
          echo "Smoke train succeeded"
