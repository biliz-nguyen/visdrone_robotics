name: VisDrone Smoke Train

on:
  push:
    branches:
      - setup/gpu-runner-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-train:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-flight CUDA
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" -c "import torch; print('Torch:', torch.__version__); print('Torch CUDA:', torch.version.cuda); print('CUDA available:', torch.cuda.is_available()); print('Device count:', torch.cuda.device_count()); assert torch.cuda.is_available(), 'CUDA unavailable before setup'; print('GPU:', torch.cuda.get_device_name(0))"

      - name: Verify official VisDrone dataset
        shell: bash
        run: |
          set -euo pipefail
          DATASET=/home/minh/Desktop/project/visdrone_local_project/dataset
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-train/annotations"
          test -d "$DATASET/VisDrone2019-DET-val/images"
          test -d "$DATASET/VisDrone2019-DET-val/annotations"
          test -d "$DATASET/VisDrone2019-DET-test-dev/images"
          test -d "$DATASET/VisDrone2019-DET-test-dev/annotations"

          TRAIN=$(find "$DATASET/VisDrone2019-DET-train/images" -maxdepth 1 -type f | wc -l)
          VAL=$(find "$DATASET/VisDrone2019-DET-val/images" -maxdepth 1 -type f | wc -l)
          TEST=$(find "$DATASET/VisDrone2019-DET-test-dev/images" -maxdepth 1 -type f | wc -l)

          echo "train images: $TRAIN"
          echo "val images: $VAL"
          echo "test-dev images: $TEST"

          test "$TRAIN" -eq 6471
          test "$VAL" -eq 548
          test "$TEST" -eq 1610

      - name: Write runner-local config
        shell: bash
        run: |
          cat > config/local.yaml <<'EOF'
          dataset_root: "/home/minh/Desktop/project/visdrone_local_project/dataset"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          EOF

      - name: Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Post-setup CUDA
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -c "import torch; print('Torch:', torch.__version__); print('Torch CUDA:', torch.version.cuda); print('CUDA available:', torch.cuda.is_available()); assert torch.cuda.is_available(), 'CUDA unavailable after setup'; print('GPU:', torch.cuda.get_device_name(0))"

      - name: Switch to one-epoch smoke protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -c "from pathlib import Path; import yaml; p=Path('config/experiment.yaml'); c=yaml.safe_load(p.read_text()); c['preset']='reg4_eca'; c['train']['epochs']=1; c['train']['save_period']=1; c['train']['patience']=0; p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8'); print(p.read_text())"

      - name: Architecture sanity and dataset conversion
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sanity.py

      - name: Train one epoch
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/train.py

      - name: Summarize outputs
        if: always()
        shell: bash
        run: |
          echo "=== latest runs ==="
          find runs -maxdepth 3 -type f \( -name 'results.csv' -o -name 'args.yaml' -o -name 'best.pt' -o -name 'last.pt' \) -printf '%p %k KB\n' 2>/dev/null | tail -40 || true
          echo "=== state ==="
          find state -maxdepth 1 -type f -name '*.json' -print -exec cat {} \; 2>/dev/null || true
