name: VisDrone Smoke Train

on:
  workflow_dispatch:

jobs:
  smoke-train:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write runner-local config
        shell: bash
        run: |
          cat > config/local.yaml <<'EOF'
          dataset_root: "/home/minh/Desktop/project/visdrone_local_project/dataset"
          train_images: "train/images"
          val_images: "valid/images"
          test_images: "test/images"
          test_image: ""
          EOF

      - name: Verify GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          test -d /home/minh/Desktop/project/visdrone_local_project/dataset/train/images
          test -d /home/minh/Desktop/project/visdrone_local_project/dataset/valid/images
          echo "train=$(find /home/minh/Desktop/project/visdrone_local_project/dataset/train/images -maxdepth 1 -type f | wc -l)"
          echo "valid=$(find /home/minh/Desktop/project/visdrone_local_project/dataset/valid/images -maxdepth 1 -type f | wc -l)"

      - name: Setup dependencies
        shell: bash
        env:
          PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
        run: |
          set -euo pipefail
          bash setup_local.sh

      - name: Switch to one-epoch smoke protocol
        shell: bash
        run: |
          /home/minh/miniconda3/bin/conda run -n torch251 python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('config/experiment.yaml')
          cfg = yaml.safe_load(p.read_text())
          cfg['preset'] = 'reg4_eca'
          cfg['train']['epochs'] = 1
          cfg['train']['save_period'] = 1
          cfg['train']['patience'] = 0
          p.write_text(yaml.safe_dump(cfg, sort_keys=False), encoding='utf-8')
          print(p.read_text())
          PY

      - name: Architecture sanity before training
        shell: bash
        run: |
          set -euo pipefail
          /home/minh/miniconda3/bin/conda run -n torch251 python scripts/sanity.py

      - name: Train one epoch on real VisDrone data
        shell: bash
        run: |
          set -euo pipefail
          /home/minh/miniconda3/bin/conda run -n torch251 python scripts/train.py

      - name: Summarize outputs
        if: always()
        shell: bash
        run: |
          echo "=== latest runs ==="
          find runs -maxdepth 3 -type f \( -name 'results.csv' -o -name 'args.yaml' -o -name 'best.pt' -o -name 'last.pt' \) -printf '%p %k KB\n' 2>/dev/null | tail -30 || true
          echo "=== state ==="
          find state -maxdepth 1 -type f -name '*.json' -print -exec cat {} \; 2>/dev/null || true
