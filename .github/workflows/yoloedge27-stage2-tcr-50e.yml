name: YOLOEdge27 Stage2 TCR 50e

on:
  push:
    branches:
      - research/yoloedge27-tinyassign-v1
    paths:
      - .github/workflows/yoloedge27-stage2-tcr-50e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-stage2-tcr-50e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stage2-tcr-50e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      PRESET: edge27_spr_tcr_v1
      EPOCHS: "50"
      ROOT: /home/minh/yoloedge27_experiments/stage2/edge27_spr_tcr_v1_50e
      REPORT_DIR: reports/yoloedge27/stage2/tinyassign_v1_50e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout latest Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-tinyassign-v1
          fetch-depth: 0

      - name: Verify revision and approval target
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_spr_tcr_v1' config/experiment.yaml
          grep -q 'TinyCandidateRecoveryAssigner' src/tiny_assigner.py

      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Prepare clean 50e output root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT/runs" "$ROOT/state" "$ROOT/outputs" "$ROOT/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$ROOT/runs"
          state_dir: "$ROOT/state"
          outputs_dir: "$ROOT/outputs"
          generated_dir: "$ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          from ultralytics.utils.tal import TaskAlignedAssigner
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          print('TAL:', TaskAlignedAssigner.__module__)
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Lock fair 50e protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('config/experiment.yaml')
          c = yaml.safe_load(p.read_text())
          c['preset'] = 'edge27_spr_tcr_v1'
          c['train']['epochs'] = 50
          # Must match completed SPR-v1 Stage1 control exactly.
          c['train']['batch'] = 8
          c['train']['nbs'] = 16
          c['train']['workers'] = 4
          c['train']['save_period'] = 10
          c['train']['patience'] = 0
          c['pretrained'] = False
          p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8')
          print(p.read_text())
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_tiny_assigner.py

      - name: Architecture and assigner sanity
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sanity.py | tee "$REPORT_DIR/sanity.txt"

      - name: Verify fair control protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml
          control = yaml.safe_load(Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_args.yaml').read_text())
          exp = yaml.safe_load(Path('config/experiment.yaml').read_text())
          t = exp['train']
          checks = {
              'epochs': (int(t['epochs']), int(control['epochs'])),
              'batch': (int(t['batch']), int(control['batch'])),
              'nbs': (int(t['nbs']), int(control['nbs'])),
              'imgsz': (int(t['imgsz']), int(control['imgsz'])),
              'workers': (int(t['workers']), int(control['workers'])),
              'lr0': (float(t['lr0']), float(control['lr0'])),
              'lrf': (float(t['lrf']), float(control['lrf'])),
              'momentum': (float(t['momentum']), float(control['momentum'])),
              'weight_decay': (float(t['weight_decay']), float(control['weight_decay'])),
              'warmup_epochs': (float(t['warmup_epochs']), float(control['warmup_epochs'])),
              'seed': (int(exp['seed']), int(control['seed'])),
          }
          for k, (a, b) in checks.items():
              print(k, a, b)
              assert a == b, f'{k}: Stage2={a} control={b}'
          assert exp['pretrained'] is False and control['pretrained'] is False
          print('FAIR CONTROL PROTOCOL MATCH: PASS')
          PY

      - name: Train TCR 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/train.py

      - name: Locate 50e checkpoint and outputs
        shell: bash
        run: |
          set -euo pipefail
          BEST=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          pts = list(root.glob('runs/*/weights/best.pt'))
          if not pts:
              raise SystemExit('No best.pt after Stage2 TCR 50e')
          print(max(pts, key=lambda p: p.stat().st_mtime))
          PY
          )
          RESULTS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/results.csv'))
          if not xs:
              raise SystemExit('No results.csv after Stage2 TCR 50e')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          ARGS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/args.yaml'))
          if not xs:
              raise SystemExit('No args.yaml after Stage2 TCR 50e')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          test -f "$BEST" && test -f "$RESULTS" && test -f "$ARGS"
          echo "BEST=$BEST" >> "$GITHUB_ENV"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "BEST=$BEST"

      - name: Evaluate best TCR 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/eval_screening.py --weights "$BEST" --output "$REPORT_DIR/tcr_50e_eval.json"

      - name: Build fair 50e comparison summary
        shell: bash
        run: |
          set -euo pipefail
          cp "$RESULTS" "$REPORT_DIR/tcr_50e_results.csv"
          cp "$ARGS" "$REPORT_DIR/tcr_50e_args.yaml"
          "$PYTHON_BIN" - <<'PY'
          import json, os
          from pathlib import Path

          report = Path(os.environ['REPORT_DIR'])
          tcr = json.loads((report / 'tcr_50e_eval.json').read_text())
          control = json.loads(Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_eval.json').read_text())
          mechanism = json.loads(Path('reports/yoloedge27/stage2/tinyassign_v1/gate_tal_exact.json').read_text())

          def agg(d):
              a = d['aggregate']
              return {k: float(a[k]) for k in ('precision', 'recall', 'map50', 'map50_95')}

          ca = agg(control)
          ta = agg(tcr)
          focus = {}
          for cls in ('pedestrian', 'people'):
              c = control['per_class'][cls]
              t = tcr['per_class'][cls]
              focus[cls] = {
                  'control': {k: float(c[k]) for k in ('precision','recall','map50','map50_95')},
                  'tcr': {k: float(t[k]) for k in ('precision','recall','map50','map50_95')},
                  'delta': {k: float(t[k]) - float(c[k]) for k in ('precision','recall','map50','map50_95')},
              }

          summary = {
              'purpose': 'Local fair 50e Stage2 screening; not final Kaggle paper evidence.',
              'control': 'SPR-Down v1 + standard TAL, completed local 50e run',
              'candidate': 'SPR-Down v1 + Tiny Candidate Recovery, local 50e run',
              'protocol_match': 'same Stage1 optimizer/augmentation/imgsz/batch/nbs/seed; only assignment changes',
              'mechanism_gate_tal_exact': mechanism,
              'control_50e': ca,
              'tcr_50e': ta,
              'delta_50e': {k: ta[k] - ca[k] for k in ta},
              'focus': focus,
              'candidate_weights': tcr['weights'],
              'caution': 'single local runs with deterministic=false; use for screening only.',
          }
          (report / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit compact 50e reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-tinyassign-v1"
            echo "preset=$PRESET"
            echo "epochs=$EPOCHS"
            echo "root=$ROOT"
            echo "best_pt=${BEST:-not_available}"
            echo "results_csv=${RESULTS:-not_available}"
            echo "approved_50e=true"
            echo "note=local Stage2 screening; final paper evidence must use locked Kaggle protocol"
          } > "$REPORT_DIR/paths.txt"

          # Runtime edits are not research-source changes; restore them before commit.
          git checkout -- config/experiment.yaml || true
          git status --short

          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Record Stage2 TCR 50e screening"
          git pull --rebase origin research/yoloedge27-tinyassign-v1
          git push origin HEAD:research/yoloedge27-tinyassign-v1
