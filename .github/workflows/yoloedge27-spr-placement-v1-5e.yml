name: YOLOEdge27 SPR Placement v1 5e

on:
  push:
    branches:
      - research/yoloedge27-spr-placement-v1
    paths:
      - .github/workflows/yoloedge27-spr-placement-v1-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-spr-placement-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  spr-placement-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 480
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage1/spr_placement_v1_5e
      REPORT_DIR: reports/yoloedge27/stage1/spr_placement_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout latest placement branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-spr-placement-v1
          fetch-depth: 0

      - name: Verify revision and placement space
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_spr_p2p3' config/experiment.yaml
          grep -q 'edge27_spr_p3p4' config/experiment.yaml
          grep -q 'edge27_spr_all' config/experiment.yaml
          grep -q 'all 2\^3' config/experiment.yaml
          grep -q 'run_spr_placement_screen' .github/workflows/yoloedge27-spr-placement-v1-5e.yml

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap runner-local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT/bootstrap/runs" "$SCREEN_ROOT/bootstrap/state" "$SCREEN_ROOT/bootstrap/outputs" "$SCREEN_ROOT/bootstrap/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/bootstrap/runs"
          state_dir: "$SCREEN_ROOT/bootstrap/state"
          outputs_dir: "$SCREEN_ROOT/bootstrap/outputs"
          generated_dir: "$SCREEN_ROOT/bootstrap/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          from ultralytics.utils.tal import TaskAlignedAssigner
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          print('TAL:', TaskAlignedAssigner.__module__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Placement unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_spr_placement_builder.py

      - name: Run exhaustive 8-variant placement screen
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_spr_placement_screen.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact placement reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-spr-placement-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "variants=B0,S1,S2,S3,S4,S5,S6,S7"
            echo "epochs_each=5"
            echo "assignment=standard_TAL"
            echo "note=local screening only; no checkpoints committed; final evidence requires locked Kaggle reruns"
          } > "$REPORT_DIR/workflow_meta.txt"

          # Never commit runtime mutations.
          git checkout -- config/experiment.yaml || true
          git status --short

          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No placement report changes to commit"
            exit 0
          fi
          git commit -m "Record SPR placement v1 5e screening"
          git pull --rebase origin research/yoloedge27-spr-placement-v1
          git push origin HEAD:research/yoloedge27-spr-placement-v1
