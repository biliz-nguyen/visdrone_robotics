name: YOLOEdge27 Stage2 TAQ v2 5e

on:
  push:
    branches:
      - research/yoloedge27-tinyquality-v2
    paths:
      - .github/workflows/yoloedge27-stage2-taq-v2-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-stage2-taq-v2-5e
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stage2-taq-v2-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 180
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      PRESET: edge27_spr_taq_v2
      EPOCHS: "5"
      ROOT: /home/minh/yoloedge27_experiments/stage2/edge27_spr_taq_v2_5e
      REPORT_DIR: reports/yoloedge27/stage2/tinyquality_v2_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout latest TAQ v2 branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-tinyquality-v2
          fetch-depth: 0

      - name: Verify revision and TAQ v2 source
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_spr_taq_v2' config/experiment.yaml
          grep -q 'beta_floor: 5.0' config/experiment.yaml
          grep -q 'TinyAdaptiveQualityAssigner' src/tiny_quality_assigner.py

      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Prepare clean output root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT/runs" "$ROOT/state" "$ROOT/outputs" "$ROOT/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$ROOT/runs"
          state_dir: "$ROOT/state"
          outputs_dir: "$ROOT/outputs"
          generated_dir: "$ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          from ultralytics.utils.tal import TaskAlignedAssigner
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          print('TAL:', TaskAlignedAssigner.__module__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Lock fair TAQ v2 5e protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('config/experiment.yaml')
          c = yaml.safe_load(p.read_text())
          c['preset'] = 'edge27_spr_taq_v2'
          c['train']['epochs'] = 5
          c['train']['batch'] = 8
          c['train']['nbs'] = 16
          c['train']['workers'] = 4
          c['train']['save_period'] = 1
          c['train']['patience'] = 0
          c['pretrained'] = False
          assert float(c['presets']['edge27_spr_taq_v2']['tiny_quality_assigner']['beta_floor']) == 5.0
          assert float(c['presets']['edge27_spr_taq_v2']['tiny_quality_assigner']['tiny_min_side']) == 16.0
          p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8')
          print(p.read_text())
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_tiny_quality_assigner.py

      - name: Architecture and TAQ v2 sanity
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sanity.py | tee "$REPORT_DIR/sanity.txt"
          grep -q 'Assigner: TinyAdaptiveQualityAssigner' "$REPORT_DIR/sanity.txt"
          grep -q 'Beta floor: 5.0' "$REPORT_DIR/sanity.txt"

      - name: TAQ v2 mechanism diagnostic
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/tiny_quality_diagnostic.py --split train --output "$REPORT_DIR/train_beta_diagnostic.json"
          "$PYTHON_BIN" scripts/tiny_quality_diagnostic.py --split val --output "$REPORT_DIR/val_beta_diagnostic.json"

      - name: Train TAQ v2 5e smoke
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/train.py

      - name: Locate checkpoint and outputs
        shell: bash
        run: |
          set -euo pipefail
          BEST=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          pts = list(root.glob('runs/*/weights/best.pt'))
          if not pts:
              raise SystemExit('No best.pt after TAQ v2 5e')
          print(max(pts, key=lambda p: p.stat().st_mtime))
          PY
          )
          RESULTS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/results.csv'))
          if not xs:
              raise SystemExit('No results.csv after TAQ v2 5e')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          ARGS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/args.yaml'))
          if not xs:
              raise SystemExit('No args.yaml after TAQ v2 5e')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          test -f "$BEST" && test -f "$RESULTS" && test -f "$ARGS"
          echo "BEST=$BEST" >> "$GITHUB_ENV"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Evaluate best TAQ v2 5e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/eval_screening.py --weights "$BEST" --output "$REPORT_DIR/taq_v2_5e_eval.json"

      - name: Build 5e comparison summary
        shell: bash
        run: |
          set -euo pipefail
          cp "$RESULTS" "$REPORT_DIR/taq_v2_5e_results.csv"
          cp "$ARGS" "$REPORT_DIR/taq_v2_5e_args.yaml"
          "$PYTHON_BIN" - <<'PY'
          import csv, json, os
          from pathlib import Path

          report = Path(os.environ['REPORT_DIR'])
          v2_csv = Path(os.environ['RESULTS'])
          control_csv = Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_results.csv')
          tcr_csv = Path('reports/yoloedge27/stage2/tinyassign_v1/tcr_5e_results.csv')
          v1_csv = Path('reports/yoloedge27/stage2/tinyquality_v1_5e/taq_5e_results.csv')

          def row5(path):
              rows = list(csv.DictReader(path.open()))
              if len(rows) < 5:
                  raise RuntimeError(f'Need epoch-5 row in {path}')
              return rows[4]

          def metric(row, *names):
              for n in names:
                  if n in row and row[n] != '':
                      return float(row[n])
              raise KeyError(names)

          def pack(row):
              return {
                  'precision': metric(row, 'metrics/precision(B)', 'metrics/precision'),
                  'recall': metric(row, 'metrics/recall(B)', 'metrics/recall'),
                  'map50': metric(row, 'metrics/mAP50(B)', 'metrics/mAP50'),
                  'map50_95': metric(row, 'metrics/mAP50-95(B)', 'metrics/mAP50-95'),
              }

          control = pack(row5(control_csv))
          tcr = pack(row5(tcr_csv))
          taq_v1 = pack(row5(v1_csv))
          taq_v2 = pack(row5(v2_csv))
          best_eval = json.loads((report / 'taq_v2_5e_eval.json').read_text())
          train_diag = json.loads((report / 'train_beta_diagnostic.json').read_text())
          val_diag = json.loads((report / 'val_beta_diagnostic.json').read_text())

          summary = {
              'purpose': 'TAQ v2 5e local mechanism screening; not paper evidence.',
              'model': 'SPR-Down v1 + TAQ v2',
              'change_from_taq_v1': 'beta_floor 4.0 -> 5.0; tiny threshold remains 16px; candidate region and all other training settings unchanged',
              'control_epoch5': control,
              'tcr_epoch5': tcr,
              'taq_v1_epoch5': taq_v1,
              'taq_v2_epoch5': taq_v2,
              'delta_v2_vs_control': {k: taq_v2[k] - control[k] for k in taq_v2},
              'delta_v2_vs_tcr': {k: taq_v2[k] - tcr[k] for k in taq_v2},
              'delta_v2_vs_v1': {k: taq_v2[k] - taq_v1[k] for k in taq_v2},
              'taq_v2_best_5e_eval': best_eval,
              'train_beta_diagnostic': train_diag,
              'val_beta_diagnostic': val_diag,
              'decision_rule': 'Use this only to decide whether beta_floor=5 merits a later 50e run; do not treat 5e as paper evidence.',
              'caution': 'deterministic=false; early-epoch differences are screening signals only.',
          }
          (report / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit compact TAQ v2 reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-tinyquality-v2"
            echo "preset=$PRESET"
            echo "epochs=$EPOCHS"
            echo "beta_floor=5.0"
            echo "root=$ROOT"
            echo "best_pt=${BEST:-not_available}"
            echo "results_csv=${RESULTS:-not_available}"
            echo "note=local 5e screening only; no 50e TAQ v2 run authorized"
          } > "$REPORT_DIR/paths.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Record TAQ v2 5e screening"
          git pull --rebase origin research/yoloedge27-tinyquality-v2
          git push origin HEAD:research/yoloedge27-tinyquality-v2
