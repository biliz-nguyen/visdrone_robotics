name: YOLOEdge27 Stage2 TAL-Exact Rediagnostic

on:
  push:
    branches:
      - research/yoloedge27-tinyassign-v1
    paths:
      - .github/workflows/yoloedge27-stage2-rediagnose.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-stage2-rediagnose
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rediagnose:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 60
    env:
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      ROOT: /home/minh/yoloedge27_experiments/stage2/edge27_spr_tcr_v1_5e
      REPORT_DIR: reports/yoloedge27/stage2/tinyassign_v1

    steps:
      - name: Checkout latest Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-tinyassign-v1
          fetch-depth: 0

      - name: Prepare config only
        shell: bash
        run: |
          set -euo pipefail
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$ROOT/runs"
          state_dir: "$ROOT/state"
          outputs_dir: "$ROOT/outputs"
          generated_dir: "$ROOT/generated"
          EOF
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('config/experiment.yaml')
          c = yaml.safe_load(p.read_text())
          c['preset'] = 'edge27_spr_tcr_v1'
          c['train']['epochs'] = 5
          c['train']['batch'] = 8
          c['train']['nbs'] = 16
          c['pretrained'] = False
          p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8')
          PY

      - name: Compute TAL-exact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          "$PYTHON_BIN" scripts/tiny_assignment_diagnostic_tal_exact.py --split train --output "$REPORT_DIR/train_candidate_diagnostic_tal_exact.json"
          "$PYTHON_BIN" scripts/tiny_assignment_diagnostic_tal_exact.py --split val --output "$REPORT_DIR/val_candidate_diagnostic_tal_exact.json"

      - name: Rebuild summary with TAL-exact gate
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import csv, json, os
          from pathlib import Path

          report = Path(os.environ['REPORT_DIR'])
          tcr_csv = report / 'tcr_5e_results.csv'
          control_csv = Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_results.csv')
          eval_path = report / 'tcr_5e_eval.json'
          for p in (tcr_csv, control_csv, eval_path):
              if not p.exists():
                  raise SystemExit(f'Missing recovered result file: {p}')

          def rows(path):
              with path.open(newline='') as f:
                  return list(csv.DictReader(f))

          def metric(row, *names):
              for n in names:
                  if n in row and row[n] != '':
                      return float(row[n])
              raise KeyError(names)

          def pack(row):
              return {
                  'map50': metric(row, 'metrics/mAP50(B)', 'metrics/mAP50'),
                  'map50_95': metric(row, 'metrics/mAP50-95(B)', 'metrics/mAP50-95'),
                  'precision': metric(row, 'metrics/precision(B)', 'metrics/precision'),
                  'recall': metric(row, 'metrics/recall(B)', 'metrics/recall'),
              }

          tr, cr = rows(tcr_csv), rows(control_csv)
          tcr5, control5 = pack(tr[4]), pack(cr[4])
          train_diag = json.loads((report / 'train_candidate_diagnostic_tal_exact.json').read_text())
          val_diag = json.loads((report / 'val_candidate_diagnostic_tal_exact.json').read_text())
          best_eval = json.loads(eval_path.read_text())

          starved = float(train_diag['tiny']['starved_fraction'])
          focus = float(train_diag['pedestrian_people_tiny']['starved_fraction'])
          gate = {
              'threshold': 0.05,
              'diagnostic': 'Ultralytics v8.4.56 TAL-exact candidate region',
              'tiny_starved_fraction': starved,
              'pedestrian_people_tiny_starved_fraction': focus,
              'gate': 'PASS_RUN_5E' if starved >= 0.05 else 'FAIL_REDIRECT',
              'note': 'Post-hoc mechanism check only; no retraining performed.'
          }
          (report / 'gate_tal_exact.json').write_text(json.dumps(gate, indent=2) + '\n')

          summary = {
              'purpose': 'Local 5e Stage2 screening; recovered results plus TAL-exact post-hoc mechanism diagnostic.',
              'model': 'SPR-Down v1 + Tiny Candidate Recovery',
              'control': 'SPR-Down v1 + standard TAL, epoch-5 row from completed 50e local run',
              'candidate_gate_tal_exact': gate,
              'control_epoch5': control5,
              'tcr_epoch5': tcr5,
              'delta_epoch5': {k: tcr5[k] - control5[k] for k in tcr5},
              'tcr_best_5e_eval': best_eval,
              'train_candidate_diagnostic_tal_exact': train_diag,
              'val_candidate_diagnostic_tal_exact': val_diag,
              'caution': 'deterministic=false; 5e is screening only and not paper evidence.'
          }
          (report / 'summary_tal_exact.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit corrected diagnostic reports
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- config/experiment.yaml
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR/train_candidate_diagnostic_tal_exact.json" \
                  "$REPORT_DIR/val_candidate_diagnostic_tal_exact.json" \
                  "$REPORT_DIR/gate_tal_exact.json" \
                  "$REPORT_DIR/summary_tal_exact.json"
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "Record TAL-exact Stage2 TCR diagnostics"
          git pull --rebase origin research/yoloedge27-tinyassign-v1
          git push origin HEAD:research/yoloedge27-tinyassign-v1
