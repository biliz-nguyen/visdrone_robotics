name: YOLOEdge27 Tiny Shift Consistency v1 5e

on:
  push:
    branches:
      - research/yoloedge27-shiftcons-v1
    paths:
      - .github/workflows/yoloedge27-shiftcons-v1-5e.yml
      - scripts/run_shift_consistency_test.py
      - src/shift_consistency_head.py
      - src/shift_consistency_loss.py
      - src/ultralytics_patch.py
      - tests/test_shift_consistency.py
  workflow_dispatch:

concurrency:
  group: yoloedge27-shiftcons-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shiftcons-v1-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage4/shiftcons_v1_5e
      REPORT_DIR: reports/yoloedge27/stage4/shiftcons_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout shift-consistency research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-shiftcons-v1
          fetch-depth: 0

      - name: Verify mechanism and controls
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'class TinyShiftConsistencyDetect' src/shift_consistency_head.py
          grep -q 'class TinyShiftConsistencyLoss' src/shift_consistency_loss.py
          grep -q 'shift_equivariance_penalty' src/shift_consistency_loss.py
          grep -q 'one highest-TAL-score representative' scripts/run_shift_consistency_test.py
          test -f reports/yoloedge27/stage3/head_snr_v1_5e/summary.json

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_shift_consistency.py

      - name: Train only S1 shift-consistency student
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_shift_consistency_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4 \
            --shift-lambda 0.25 \
            --tiny-threshold 16 \
            --max-shift-px 1

      - name: Commit compact shift-consistency reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-shiftcons-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "student=H1 direct reg1"
            echo "new_variant=S1 tiny shift equivariance consistency"
            echo "epochs=5"
            echo "shift_lambda=0.25"
            echo "tiny_threshold_px=16"
            echo "shift_px=1"
            echo "shift_set=cardinal +/-1 pixel"
            echo "inference_change=none"
            echo "training_cost=one auxiliary forward per batch"
            echo "note=local mechanism screening only"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No shift-consistency report changes to commit"
            exit 0
          fi
          git commit -m "Record tiny shift-consistency v1 5e screening"
          git pull --rebase origin research/yoloedge27-shiftcons-v1
          git push origin HEAD:research/yoloedge27-shiftcons-v1
