name: YOLOEdge27 Fine-Scale Neck Reallocation N2 5e

on:
  push:
    branches:
      - research/yoloedge27-neck-realloc-v1
    paths:
      - .github/workflows/yoloedge27-neck-realloc-v1-5e.yml
      - config/experiment.yaml
      - scripts/run_neck_realloc_test.py
      - scripts/sanity.py
      - src/config.py
      - src/model_builder.py
      - src/ultralytics_patch.py
      - tests/test_neck_realloc.py
      - tests/test_sprdown.py
  workflow_dispatch:

concurrency:
  group: yoloedge27-neck-realloc-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  neck-realloc-n2-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage6/neck_realloc_v1_5e
      REPORT_DIR: reports/yoloedge27/stage6/neck_realloc_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout N2 research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-neck-realloc-v1
          fetch-depth: 0

      - name: Verify N2 mechanism and scripts
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_neck_realloc_v1' config/experiment.yaml
          grep -q 'N2_REALLOC_NOMINAL = {"p2": 160, "p3": 256, "p4": 384}' src/config.py
          grep -q 'neck_mode.*realloc' src/config.py
          grep -q 'pan_down_p3_p4' src/model_builder.py
          grep -q 'Neck effective channels P2/P3/P4' scripts/sanity.py
          grep -q 'N2_PROBE_JSON=' scripts/run_neck_realloc_test.py
          test -f reports/yoloedge27/stage3/head_snr_v1_5e/summary.json
          test -f reports/yoloedge27/stage5/neck_rep_v1_5e/summary.json
          "$PYTHON_BIN" -m py_compile \
            src/config.py \
            src/model_builder.py \
            src/ultralytics_patch.py \
            scripts/sanity.py \
            scripts/run_neck_realloc_test.py \
            tests/test_neck_realloc.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_neck_realloc.py

      - name: Train and evaluate only N2
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_neck_realloc_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4 \
            --max-gflops-ratio 1.03 \
            --max-params-ratio 1.10

      - name: Commit compact N2 reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-neck-realloc-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "variant=N2 fine-scale capacity reallocation"
            echo "base=H1 direct reg1 with S1 SPR P4->P5"
            echo "nominal_neck_channels=P2:160,P3:256,P4:384"
            echo "effective_neck_channels=P2:40,P3:64,P4:96"
            echo "relative_vs_H1=P2:+25%,P3:0%,P4:-25%"
            echo "attention=none"
            echo "assignment=stock TAL"
            echo "loss=standard"
            echo "reparameterization=none"
            echo "epochs=5"
            echo "gflops_budget=1.03x H1"
            echo "params_budget=1.10x H1"
            echo "note=local mechanism screening only; widths locked before training"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No N2 report changes to commit"
            exit 0
          fi
          git commit -m "Record neck reallocation N2 5e screening"
          git pull --rebase origin research/yoloedge27-neck-realloc-v1
          git push origin HEAD:research/yoloedge27-neck-realloc-v1
