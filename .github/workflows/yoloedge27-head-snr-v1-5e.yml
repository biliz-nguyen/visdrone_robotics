name: YOLOEdge27 Head SNR v1 5e

on:
  push:
    branches:
      - research/yoloedge27-head-snr-v1
    paths:
      - .github/workflows/yoloedge27-head-snr-v1-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-head-snr-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  head-screen-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage3/head_snr_v1_5e
      REPORT_DIR: reports/yoloedge27/stage3/head_snr_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout head research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-head-snr-v1
          fetch-depth: 0

      - name: Verify revision and no-rerun controls
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_head_direct_r1' config/experiment.yaml
          grep -q 'edge27_head_snr_16_8_4' config/experiment.yaml
          grep -q 'edge27_head_hybrid_16_4_1' config/experiment.yaml
          grep -q 'StrideRegDetect' src/stride_reg_head.py
          grep -q 'StrideRegDetectionLoss' src/stride_reg_loss.py
          test -f reports/yoloedge27/stage1/spr_placement_v1_5e/s1/results.csv
          test -f reports/yoloedge27/stage1/spr_placement_v1_5e/s1/best_eval.json
          echo 'H0 S1 control exists and will be reused, not retrained.'

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT/bootstrap/runs" "$SCREEN_ROOT/bootstrap/state" "$SCREEN_ROOT/bootstrap/outputs" "$SCREEN_ROOT/bootstrap/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/bootstrap/runs"
          state_dir: "$SCREEN_ROOT/bootstrap/state"
          outputs_dir: "$SCREEN_ROOT/bootstrap/outputs"
          generated_dir: "$SCREEN_ROOT/bootstrap/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_head_builder.py \
            tests/test_stride_reg_head.py

      - name: Run H1-H3 head screen without rerunning H0
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_head_screen.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact head reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-head-snr-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "H0=reuse existing S1 5e; NOT retrained"
            echo "new_variants=H1,H2,H3"
            echo "epochs_each_new_variant=5"
            echo "backbone=S1 SPR P4->P5"
            echo "assignment=standard_TAL"
            echo "note=local screening only; checkpoints remain runner-local"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No head report changes to commit"
            exit 0
          fi
          git commit -m "Record head SNR v1 5e screening"
          git pull --rebase origin research/yoloedge27-head-snr-v1
          git push origin HEAD:research/yoloedge27-head-snr-v1
