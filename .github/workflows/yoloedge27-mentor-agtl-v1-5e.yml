name: YOLOEdge27 AGTL Mentor Transfer v1 5e

on:
  push:
    branches:
      - research/yoloedge27-mentor-agtl-v1
    paths:
      - .github/workflows/yoloedge27-mentor-agtl-v1-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-mentor-agtl-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agtl-v1-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      MENTOR_PT: /home/minh/yoloedge27_experiments/stage1/edge27_spr_v1_50e/runs/sprdown_reg16_standard_attn-none_50e_seed42/weights/best.pt
      YOLOEDGE27_MENTOR_PT: /home/minh/yoloedge27_experiments/stage1/edge27_spr_v1_50e/runs/sprdown_reg16_standard_attn-none_50e_seed42/weights/best.pt
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage4/mentor_agtl_v1_5e
      REPORT_DIR: reports/yoloedge27/stage4/mentor_agtl_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout AGTL research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-mentor-agtl-v1
          fetch-depth: 0

      - name: Verify mechanism and frozen mentor
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'AdvantageGatedMentorDetect' src/mentor_transfer_head.py
          grep -q 'advantage_gate' src/mentor_transfer_loss.py
          grep -q 'teacher_iou - student_iou' src/mentor_transfer_loss.py
          test -f "$MENTOR_PT"
          test "$YOLOEDGE27_MENTOR_PT" = "$MENTOR_PT"
          test -f "$YOLOEDGE27_MENTOR_PT"
          test -f reports/yoloedge27/stage3/head_snr_v1_5e/summary.json
          echo "Frozen mentor: $MENTOR_PT"
          echo "Criterion mentor env: $YOLOEDGE27_MENTOR_PT"

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import os
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          print('Mentor env:', os.environ.get('YOLOEDGE27_MENTOR_PT'))
          assert torch.cuda.is_available()
          assert os.environ.get('YOLOEDGE27_MENTOR_PT')
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_mentor_transfer.py

      - name: Train only M1 AGTL student
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_agtl_test.py \
            --dataset "$DATASET" \
            --mentor "$MENTOR_PT" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4 \
            --mentor-lambda 0.25 \
            --tiny-threshold 16 \
            --advantage-margin 0.05 \
            --min-teacher-iou 0.10

      - name: Commit compact AGTL reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-mentor-agtl-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "mentor_pt=$MENTOR_PT"
            echo "mentor=frozen S1 reg16 50e checkpoint"
            echo "student=H1 direct reg1"
            echo "new_variant=M1 only"
            echo "epochs=5"
            echo "mentor_lambda=0.25"
            echo "tiny_threshold_px=16"
            echo "advantage_margin=0.05"
            echo "min_teacher_iou=0.10"
            echo "inference_change=none"
            echo "note=local mechanism screening only"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No AGTL report changes to commit"
            exit 0
          fi
          git commit -m "Record AGTL mentor transfer v1 5e screening"
          git pull --rebase origin research/yoloedge27-mentor-agtl-v1
          git push origin HEAD:research/yoloedge27-mentor-agtl-v1
