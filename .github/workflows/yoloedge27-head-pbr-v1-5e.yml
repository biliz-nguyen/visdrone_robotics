name: YOLOEdge27 PBR Head v1 5e

on:
  push:
    branches:
      - research/yoloedge27-head-pbr-v1
    paths:
      - .github/workflows/yoloedge27-head-pbr-v1-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-head-pbr-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pbr-head-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage3/head_pbr_v1_5e
      REPORT_DIR: reports/yoloedge27/stage3/head_pbr_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout PBR research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-head-pbr-v1
          fetch-depth: 0

      - name: Verify paired-boundary mechanism and reused controls
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_head_pbr_v1' config/experiment.yaml
          grep -q 'PairedBoundaryDetect' src/paired_boundary_head.py
          grep -q 'softplus' src/paired_boundary_head.py
          grep -q 'tanh' src/paired_boundary_head.py
          test -f reports/yoloedge27/stage3/head_snr_v1_5e/summary.json
          echo 'H0/H1 controls exist and will be reused; only P1 will train.'

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_paired_boundary_head.py \
            tests/test_pbr_model_builder.py

      - name: Train only P1 and compare with reused H0/H1
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_pbr_head_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact PBR reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-head-pbr-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "controls=H0,H1 reused; NOT retrained"
            echo "new_variant=P1 only"
            echo "epochs=5"
            echo "backbone=S1 SPR P4->P5"
            echo "assignment=standard_TAL"
            echo "head=PBR DFL-free paired-boundary regression"
            echo "note=local screening only; checkpoints remain runner-local"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No PBR report changes to commit"
            exit 0
          fi
          git commit -m "Record PBR head v1 5e screening"
          git pull --rebase origin research/yoloedge27-head-pbr-v1
          git push origin HEAD:research/yoloedge27-head-pbr-v1
