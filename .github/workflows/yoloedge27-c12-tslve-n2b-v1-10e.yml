name: YOLOEdge27 C12 TSLVE N2b Paired 10e Screen

on:
  push:
    branches:
      - research/yoloedge27-c12-tslve-n2b-v1
    paths:
      - '.github/workflows/yoloedge27-c12-tslve-n2b-v1-10e.yml'
      - 'src/scale_velocity_loss.py'
      - 'src/ultralytics_patch.py'
      - 'scripts/train.py'
      - 'scripts/run_c12_tslve_n2b_10e.py'
      - 'scripts/run_c12_phase_isolated.py'
      - 'scripts/compare_c12_isolated.py'
      - 'tests/test_scale_velocity_loss.py'
      - 'src/model_builder.py'
  workflow_dispatch:

concurrency:
  group: yoloedge27-c12-tslve-n2b-v1-10e
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  c12-tslve-n2b-paired-10e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage22/c12_tslve_n2b_v1_10e
      REPORT_DIR: reports/yoloedge27/stage22/c12_tslve_n2b_v1_10e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout C12 TSLVE branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-c12-tslve-n2b-v1
          fetch-depth: 0

      - name: Verify C12 mechanism and isolated paired protocol source
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          grep -q 'ultralytics_tag: "v8.4.56"' config/experiment.yaml
          grep -q 'edge27_neck_realloc_v2:' config/experiment.yaml
          grep -q 'p4: 416' config/experiment.yaml
          grep -q 'class TemporalScaleVelocityDetectionLoss' src/scale_velocity_loss.py
          grep -q '_normalize_hyp_for_loss' src/scale_velocity_loss.py
          grep -q 'compute_velocity_weights' src/scale_velocity_loss.py
          grep -q 'tiny_thr=16.0' src/ultralytics_patch.py
          grep -q 'small_thr=32.0' src/ultralytics_patch.py
          grep -q 'ema_beta=0.95' src/ultralytics_patch.py
          grep -q 'velocity_alpha=0.50' src/ultralytics_patch.py
          grep -q 'weight_min=0.75' src/ultralytics_patch.py
          grep -q 'weight_max=1.25' src/ultralytics_patch.py
          grep -q 'fresh_process=true' scripts/run_c12_phase_isolated.py
          grep -q 'process_isolation' scripts/compare_c12_isolated.py
          grep -q 'c12_scale_dynamics.jsonl' scripts/train.py
          test -f reports/yoloedge27/stage7/neck_realloc_v2_5e/neck_realloc_v2_5e_eval.json
          "$PYTHON_BIN" -m py_compile \
            src/scale_velocity_loss.py \
            src/ultralytics_patch.py \
            scripts/train.py \
            scripts/run_c12_tslve_n2b_10e.py \
            scripts/run_c12_phase_isolated.py \
            scripts/compare_c12_isolated.py \
            tests/test_scale_velocity_loss.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/bootstrap/runs"
          state_dir: "$SCREEN_ROOT/bootstrap/state"
          outputs_dir: "$SCREEN_ROOT/bootstrap/outputs"
          generated_dir: "$SCREEN_ROOT/bootstrap/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_neck_realloc.py \
            tests/test_scale_velocity_loss.py

      - name: Train isolated N2b control 10e
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT" "$REPORT_DIR"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          "$PYTHON_BIN" scripts/run_c12_phase_isolated.py \
            --phase control_n2b_10e \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 10 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Train isolated C12 TSLVE candidate 10e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_c12_phase_isolated.py \
            --phase candidate_c12_tslve_10e \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 10 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Compare isolated paired results
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/compare_c12_isolated.py \
            --report-dir "$REPORT_DIR"

      - name: Commit compact C12 paired reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-c12-tslve-n2b-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "mechanism=Temporal Scale Learning-Velocity Equalization"
            echo "comparison=paired_N2b_10e_vs_C12_10e"
            echo "process_isolation=true"
            echo "base=C1_SPR+C2_N2b+stock_Detect_direct_reg1"
            echo "scale_groups=tiny_lt16,small_16_32,regular_ge32"
            echo "calibration=epoch1_stock"
            echo "ema_beta=0.95"
            echo "velocity_alpha=0.50"
            echo "weight_range=0.75_1.25"
            echo "assigner=stock_TAL_exact"
            echo "box_loss=stock_exact"
            echo "class_specific_bias=false"
            echo "deployment_overhead_params=0"
            echo "deployment_overhead_gflops=0"
            echo "epochs_each=10"
            echo "test_dev_used=false"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          rm -f config/local.yaml
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No C12 report changes to commit"
            exit 0
          fi
          git commit -m "Record C12 TSLVE isolated paired 10e screening"
          git pull --rebase origin research/yoloedge27-c12-tslve-n2b-v1
          git push origin HEAD:research/yoloedge27-c12-tslve-n2b-v1
