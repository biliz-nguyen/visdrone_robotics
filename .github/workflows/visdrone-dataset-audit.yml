name: VisDrone Dataset Audit

on:
  push:
    branches:
      - setup/gpu-runner-test
    paths:
      - scripts/audit_dataset.py
      - .github/workflows/visdrone-dataset-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, visdrone]
    timeout-minutes: 15
    env:
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify dataset folders
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-train/annotations"
          test -d "$DATASET/VisDrone2019-DET-val/images"
          test -d "$DATASET/VisDrone2019-DET-val/annotations"
          test -d "$DATASET/VisDrone2019-DET-test-dev/images"
          test -d "$DATASET/VisDrone2019-DET-test-dev/annotations"

      - name: Run audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          "$PYTHON_BIN" scripts/audit_dataset.py \
            --root "$DATASET" \
            --json reports/dataset_audit.json \
            --md reports/dataset_audit.md

      - name: Save audit report to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "visdrone-runner"
          git config user.email "actions@users.noreply.github.com"
          git add reports/dataset_audit.json reports/dataset_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "Update official VisDrone dataset audit"
            git push origin HEAD:setup/gpu-runner-test
          fi
