name: YOLOEdge27 S2 P3-P4 50e

on:
  push:
    branches:
      - research/yoloedge27-spr-p3p4-50e
    paths:
      - .github/workflows/yoloedge27-spr-p3p4-50e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-spr-p3p4-50e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  s2-p3p4-50e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      PRESET: edge27_spr_p3p4
      EPOCHS: "50"
      ROOT: /home/minh/yoloedge27_experiments/stage1/edge27_spr_p3p4_50e
      REPORT_DIR: reports/yoloedge27/stage1/spr_p3p4_50e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout S2 50e branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-spr-p3p4-50e
          fetch-depth: 0

      - name: Verify revision and S2 preset
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'preset: "edge27_spr_p3p4"' config/experiment.yaml
          grep -q 'spr_placements: \["p3_p4"\]' config/experiment.yaml
          grep -q 'normalize_spr_placements' src/config.py
          grep -q 'STAGE_LAYER_INDEX' scripts/sanity.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Prepare clean S2 50e root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT/runs" "$ROOT/state" "$ROOT/outputs" "$ROOT/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$ROOT/runs"
          state_dir: "$ROOT/state"
          outputs_dir: "$ROOT/outputs"
          generated_dir: "$ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          from ultralytics.utils.tal import TaskAlignedAssigner
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          print('TAL:', TaskAlignedAssigner.__module__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Lock fair S2 50e protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml

          p = Path('config/experiment.yaml')
          c = yaml.safe_load(p.read_text())
          c['preset'] = 'edge27_spr_p3p4'
          c['train']['epochs'] = 50
          c['train']['batch'] = 8
          c['train']['nbs'] = 16
          c['train']['workers'] = 4
          c['train']['save_period'] = 10
          c['train']['patience'] = 0
          c['pretrained'] = False
          p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8')
          print(p.read_text())
          PY

      - name: Verify protocol matches completed S1 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml

          control = yaml.safe_load(Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_args.yaml').read_text())
          exp = yaml.safe_load(Path('config/experiment.yaml').read_text())
          t = exp['train']

          checks = {
              'epochs': (int(t['epochs']), int(control['epochs'])),
              'batch': (int(t['batch']), int(control['batch'])),
              'nbs': (int(t['nbs']), int(control['nbs'])),
              'imgsz': (int(t['imgsz']), int(control['imgsz'])),
              'workers': (int(t['workers']), int(control['workers'])),
              'optimizer': (str(t['optimizer']), str(control['optimizer'])),
              'lr0': (float(t['lr0']), float(control['lr0'])),
              'lrf': (float(t['lrf']), float(control['lrf'])),
              'momentum': (float(t['momentum']), float(control['momentum'])),
              'weight_decay': (float(t['weight_decay']), float(control['weight_decay'])),
              'warmup_epochs': (float(t['warmup_epochs']), float(control['warmup_epochs'])),
              'cos_lr': (bool(t['cos_lr']), bool(control['cos_lr'])),
              'box': (float(t['box']), float(control['box'])),
              'cls': (float(t['cls']), float(control['cls'])),
              'dfl': (float(t['dfl']), float(control['dfl'])),
              'hsv_h': (float(t['hsv_h']), float(control['hsv_h'])),
              'hsv_s': (float(t['hsv_s']), float(control['hsv_s'])),
              'hsv_v': (float(t['hsv_v']), float(control['hsv_v'])),
              'translate': (float(t['translate']), float(control['translate'])),
              'scale': (float(t['scale']), float(control['scale'])),
              'fliplr': (float(t['fliplr']), float(control['fliplr'])),
              'mosaic': (float(t['mosaic']), float(control['mosaic'])),
              'close_mosaic': (int(t['close_mosaic']), int(control['close_mosaic'])),
              'mixup': (float(t['mixup']), float(control['mixup'])),
              'copy_paste': (float(t['copy_paste']), float(control['copy_paste'])),
              'cutmix': (float(t['cutmix']), float(control['cutmix'])),
              'seed': (int(exp['seed']), int(control['seed'])),
              'deterministic': (bool(t['deterministic']), bool(control['deterministic'])),
          }
          for k, (a, b) in checks.items():
              print(k, a, b)
              assert a == b, f'{k}: S2={a} S1={b}'
          assert exp['pretrained'] is False and control['pretrained'] is False
          preset = exp['presets']['edge27_spr_p3p4']
          assert preset['spr_placements'] == ['p3_p4']
          assert preset['reg_max'] == 16
          assert preset['loss_mode'] == 'standard'
          assert preset['attention'] == 'none'
          print('FAIR S1/S2 PROTOCOL MATCH: PASS')
          PY

      - name: Placement unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_spr_placement_builder.py

      - name: S2 architecture sanity
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sanity.py | tee "$REPORT_DIR/sanity.txt"
          grep -q "SPR placements: \['p3_p4'\]" "$REPORT_DIR/sanity.txt"
          grep -q "'p2_p3': 'Conv'" "$REPORT_DIR/sanity.txt"
          grep -q "'p3_p4': 'SPRDown'" "$REPORT_DIR/sanity.txt"
          grep -q "'p4_p5': 'Conv'" "$REPORT_DIR/sanity.txt"
          grep -q 'SPRDown count: 1' "$REPORT_DIR/sanity.txt"
          grep -q 'Loss: standard' "$REPORT_DIR/sanity.txt"
          grep -q 'Attention: none' "$REPORT_DIR/sanity.txt"
          grep -q 'Pretrained: False' "$REPORT_DIR/sanity.txt"

      - name: Train S2 P3-P4 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/train.py

      - name: Locate S2 checkpoint and outputs
        shell: bash
        run: |
          set -euo pipefail
          BEST=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/weights/best.pt'))
          if not xs:
              raise SystemExit('No S2 best.pt found')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          RESULTS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/results.csv'))
          if not xs:
              raise SystemExit('No S2 results.csv found')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          ARGS=$("$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          xs = list(root.glob('runs/*/args.yaml'))
          if not xs:
              raise SystemExit('No S2 args.yaml found')
          print(max(xs, key=lambda p: p.stat().st_mtime))
          PY
          )
          test -f "$BEST" && test -f "$RESULTS" && test -f "$ARGS"
          echo "BEST=$BEST" >> "$GITHUB_ENV"
          echo "RESULTS=$RESULTS" >> "$GITHUB_ENV"
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "BEST=$BEST"

      - name: Evaluate best S2 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/eval_screening.py \
            --weights "$BEST" \
            --output "$REPORT_DIR/s2_p3p4_50e_eval.json"

      - name: Build S1 vs S2 50e summary
        shell: bash
        run: |
          set -euo pipefail
          cp "$RESULTS" "$REPORT_DIR/s2_p3p4_50e_results.csv"
          cp "$ARGS" "$REPORT_DIR/s2_p3p4_50e_args.yaml"
          "$PYTHON_BIN" - <<'PY'
          import json, os
          from pathlib import Path

          report = Path(os.environ['REPORT_DIR'])
          s2 = json.loads((report / 's2_p3p4_50e_eval.json').read_text())
          s1 = json.loads(Path('reports/yoloedge27/stage1/edge27_spr_v1_50e_eval.json').read_text())
          placement5 = json.loads(Path('reports/yoloedge27/stage1/spr_placement_v1_5e/summary.json').read_text())

          def agg(d):
              a = d['aggregate']
              return {k: float(a[k]) for k in ('precision', 'recall', 'map50', 'map50_95')}

          a1, a2 = agg(s1), agg(s2)
          focus = {}
          for cls in ('pedestrian', 'people'):
              x = s1['per_class'][cls]
              y = s2['per_class'][cls]
              keys = ('precision', 'recall', 'map50', 'map50_95')
              focus[cls] = {
                  's1_p4p5': {k: float(x[k]) for k in keys},
                  's2_p3p4': {k: float(y[k]) for k in keys},
                  'delta_s2_minus_s1': {k: float(y[k]) - float(x[k]) for k in keys},
              }

          summary = {
              'purpose': 'Local fair 50e S2 P3->P4 confirmation; not final Kaggle paper evidence.',
              's1': 'single SPR-Down at P4->P5',
              's2': 'single SPR-Down at P3->P4',
              'protocol_match': 'same optimizer/augmentation/imgsz/batch/nbs/seed/scratch settings; placement is the architectural variable',
              's1_50e': a1,
              's2_50e': a2,
              'delta_s2_minus_s1': {k: a2[k] - a1[k] for k in a2},
              'focus': focus,
              'complexity_5e_measured_same_architecture': {
                  's1_p4p5': placement5['variants']['S1']['complexity'],
                  's2_p3p4': placement5['variants']['S2']['complexity'],
              },
              's2_weights': s2['weights'],
              'next_ablation_if_warranted': 'S4 = SPR at P3->P4 + P4->P5; run 50e only after reviewing S2 50e because S4 was weaker than S1/S2 at 5e.',
              'caution': 'single local run, deterministic=false; screening/confirmation only. Final paper evidence must be rerun under locked Kaggle protocol.',
          }
          (report / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit compact S2 50e reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-spr-p3p4-50e"
            echo "preset=$PRESET"
            echo "placement=p3_p4"
            echo "epochs=$EPOCHS"
            echo "root=$ROOT"
            echo "best_pt=${BEST:-not_available}"
            echo "results_csv=${RESULTS:-not_available}"
            echo "assignment=standard_TAL"
            echo "note=local fair 50e confirmation only; S4 combination is not authorized in this workflow"
          } > "$REPORT_DIR/paths.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No S2 report changes to commit"
            exit 0
          fi
          git commit -m "Record S2 P3-P4 50e screening"
          git pull --rebase origin research/yoloedge27-spr-p3p4-50e
          git push origin HEAD:research/yoloedge27-spr-p3p4-50e
