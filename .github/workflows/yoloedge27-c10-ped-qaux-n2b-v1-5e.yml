name: YOLOEdge27 C10 PedQAux N2b 5e Screen

on:
  push:
    branches:
      - research/yoloedge27-c10-ped-qaux-n2b-v1
    paths:
      - '.github/workflows/yoloedge27-c10-ped-qaux-n2b-v1-5e.yml'
      - 'src/p2_quality_aux_loss.py'
      - 'src/ultralytics_patch.py'
      - 'src/model_builder.py'
      - 'tests/test_p2_quality_aux_loss.py'
      - 'tests/test_p2_quality_aux_pedestrian.py'
      - 'scripts/run_c10_ped_qaux_n2b_test.py'
  workflow_dispatch:

concurrency:
  group: yoloedge27-c10-ped-qaux-n2b-v1-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  c10-ped-qaux-n2b-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage20/c10_ped_qaux_n2b_v1_5e
      REPORT_DIR: reports/yoloedge27/stage20/c10_ped_qaux_n2b_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout C10 PedQAux branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-c10-ped-qaux-n2b-v1
          fetch-depth: 0

      - name: Verify pedestrian-only quality auxiliary mechanism and frozen base
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          grep -q 'edge27_neck_realloc_v2:' config/experiment.yaml
          grep -q 'p4: 416' config/experiment.yaml
          grep -q 'class P2QualityAuxDetectionLoss' src/p2_quality_aux_loss.py
          grep -q 'c9_focus_classes' src/ultralytics_patch.py
          grep -q 'cfg\["c9_focus_classes"\] = \[5\]' scripts/run_c10_ped_qaux_n2b_test.py
          grep -q 'focus_classes=pedestrian(5)_only' scripts/run_c10_ped_qaux_n2b_test.py
          grep -q 'people_auxiliary=false' scripts/run_c10_ped_qaux_n2b_test.py
          grep -q 'soft_target=0.5+0.5\*sqrt(detached_IoU)' scripts/run_c10_ped_qaux_n2b_test.py
          test -f reports/yoloedge27/stage7/neck_realloc_v2_5e/neck_realloc_v2_5e_eval.json
          test -f reports/yoloedge27/stage19/c9_p2_qaux_n2b_v1_5e/summary.json
          "$PYTHON_BIN" -m py_compile \
            src/p2_quality_aux_loss.py \
            src/ultralytics_patch.py \
            src/model_builder.py \
            scripts/run_c10_ped_qaux_n2b_test.py \
            tests/test_p2_quality_aux_loss.py \
            tests/test_p2_quality_aux_pedestrian.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_neck_realloc.py \
            tests/test_p2_quality_aux_loss.py \
            tests/test_p2_quality_aux_pedestrian.py

      - name: Train and evaluate pedestrian-only P2 quality auxiliary supervision on frozen N2b
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_c10_ped_qaux_n2b_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact C10 reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-c10-ped-qaux-n2b-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "mechanism=training-only pedestrian-only P2 IoU-quality-tempered tiny-center supervision"
            echo "base=C1 SPR + C2 N2b + stock direct reg1 Detect"
            echo "assigner=stock_TAL_exact"
            echo "main_loss=stock"
            echo "focus_classes=pedestrian_only"
            echo "people_auxiliary=false"
            echo "tiny_min_side=16px"
            echo "soft_target=0.5+0.5*sqrt(detached_IoU)"
            echo "target_floor=0.50"
            echo "quality_gamma=0.50"
            echo "aux_weight=0.10"
            echo "regression_aux_gradient=false"
            echo "deployment_overhead_params=0"
            echo "deployment_overhead_gflops=0"
            echo "epochs=5"
            echo "test_dev_used=false"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          rm -f config/local.yaml
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No C10 report changes to commit"
            exit 0
          fi
          git commit -m "Record C10 PedQAux N2b 5e screening"
          git pull --rebase origin research/yoloedge27-c10-ped-qaux-n2b-v1
          git push origin HEAD:research/yoloedge27-c10-ped-qaux-n2b-v1
