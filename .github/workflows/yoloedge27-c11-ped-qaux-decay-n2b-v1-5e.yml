name: YOLOEdge27 C11 PedQAuxDecay N2b 5e Screen

on:
  push:
    branches:
      - research/yoloedge27-c11-ped-qaux-decay-n2b-v1
    paths:
      - '.github/workflows/yoloedge27-c11-ped-qaux-decay-n2b-v1-5e.yml'
      - 'src/aux_schedule.py'
      - 'src/p2_quality_aux_loss.py'
      - 'src/ultralytics_patch.py'
      - 'scripts/train.py'
      - 'scripts/run_c11_ped_qaux_decay_n2b_test.py'
      - 'tests/test_aux_schedule.py'
      - 'tests/test_p2_quality_aux_loss.py'
      - 'tests/test_p2_quality_aux_pedestrian.py'
  workflow_dispatch:

concurrency:
  group: yoloedge27-c11-ped-qaux-decay-n2b-v1-5e
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  c11-ped-qaux-decay-n2b-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage21/c11_ped_qaux_decay_n2b_v1_5e
      REPORT_DIR: reports/yoloedge27/stage21/c11_ped_qaux_decay_n2b_v1_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout C11 PedQAuxDecay branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-c11-ped-qaux-decay-n2b-v1
          fetch-depth: 0

      - name: Verify decayed pedestrian-only mechanism and frozen base
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          grep -q 'edge27_neck_realloc_v2:' config/experiment.yaml
          grep -q 'p4: 416' config/experiment.yaml
          grep -q 'class P2QualityAuxDetectionLoss' src/p2_quality_aux_loss.py
          grep -q 'cosine_to_zero_weight' src/aux_schedule.py
          grep -q 'model.add_callback("on_train_epoch_start"' scripts/train.py
          grep -q 'cfg\["c9_focus_classes"\] = \[5\]' scripts/run_c11_ped_qaux_decay_n2b_test.py
          grep -q 'cfg\["c11_aux_schedule"\] = "cosine_to_zero"' scripts/run_c11_ped_qaux_decay_n2b_test.py
          grep -q 'final_epoch_aux_weight' scripts/run_c11_ped_qaux_decay_n2b_test.py
          test -f reports/yoloedge27/stage7/neck_realloc_v2_5e/neck_realloc_v2_5e_eval.json
          test -f reports/yoloedge27/stage20/c10_ped_qaux_n2b_v1_5e/summary.json
          "$PYTHON_BIN" -m py_compile \
            src/aux_schedule.py \
            src/p2_quality_aux_loss.py \
            src/ultralytics_patch.py \
            scripts/train.py \
            scripts/run_c11_ped_qaux_decay_n2b_test.py \
            tests/test_aux_schedule.py \
            tests/test_p2_quality_aux_loss.py \
            tests/test_p2_quality_aux_pedestrian.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_neck_realloc.py \
            tests/test_p2_quality_aux_loss.py \
            tests/test_p2_quality_aux_pedestrian.py \
            tests/test_aux_schedule.py

      - name: Train and evaluate C11 decayed pedestrian auxiliary supervision
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_c11_ped_qaux_decay_n2b_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact C11 reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-c11-ped-qaux-decay-n2b-v1"
            echo "head=$(git rev-parse HEAD)"
            echo "mechanism=pedestrian-only P2 IoU-quality auxiliary with epoch-wise cosine decay"
            echo "base=C1 SPR + C2 N2b + stock direct reg1 Detect"
            echo "assigner=stock_TAL_exact"
            echo "focus_classes=pedestrian_only"
            echo "people_auxiliary=false"
            echo "tiny_min_side=16px"
            echo "soft_target=0.5+0.5*sqrt(detached_IoU)"
            echo "aux_base_weight=0.10"
            echo "aux_schedule=cosine_to_zero"
            echo "aux_weights_5e=0.10000000,0.08535534,0.05000000,0.01464466,0.00000000"
            echo "final_epoch_aux_weight=0"
            echo "regression_aux_gradient=false"
            echo "deployment_overhead_params=0"
            echo "deployment_overhead_gflops=0"
            echo "epochs=5"
            echo "test_dev_used=false"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          rm -f config/local.yaml
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No C11 report changes to commit"
            exit 0
          fi
          git commit -m "Record C11 PedQAuxDecay N2b 5e screening"
          git pull --rebase origin research/yoloedge27-c11-ped-qaux-decay-n2b-v1
          git push origin HEAD:research/yoloedge27-c11-ped-qaux-decay-n2b-v1
