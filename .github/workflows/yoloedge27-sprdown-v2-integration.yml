name: YOLOEdge27 SPR-Down v2 Integration

on:
  push:
    branches:
      - research/yoloedge27-sprdown-v2
    paths:
      - .github/workflows/yoloedge27-sprdown-v2-integration.yml
      - src/config.py
      - src/model_builder.py
      - src/ultralytics_patch.py
      - src/sprdown_v2.py
      - scripts/sanity.py
      - scripts/sprdown_v2_full_model_benchmark.py
      - scripts/sprdown_v2_export_smoke.py
      - tests/test_sprdown_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-export-smoke:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      PRESET: edge27_spr_v2
      EPOCHS: "5"
      ROOT_RUN: /home/minh/yoloedge27_experiments/stage1/edge27_spr_v2_5e
      REPORT_DIR: reports/yoloedge27/stage1/sprdown_v2/integration_5e

    steps:
      - name: Checkout v2 research branch
        uses: actions/checkout@v4

      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Write runner-local config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_RUN/runs" "$ROOT_RUN/state" "$ROOT_RUN/outputs" "$ROOT_RUN/generated"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$ROOT_RUN/runs"
          state_dir: "$ROOT_RUN/state"
          outputs_dir: "$ROOT_RUN/outputs"
          generated_dir: "$ROOT_RUN/generated"
          EOF

      - name: Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Set v2 smoke protocol
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('config/experiment.yaml')
          c = yaml.safe_load(p.read_text())
          c['preset'] = 'edge27_spr_v2'
          c['train']['epochs'] = 5
          c['train']['batch'] = 8
          c['train']['nbs'] = 16
          c['train']['save_period'] = 1
          c['train']['patience'] = 0
          c['pretrained'] = False
          p.write_text(yaml.safe_dump(c, sort_keys=False), encoding='utf-8')
          print(p.read_text())
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_sprdown_v2.py

      - name: Full architecture sanity
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sanity.py | tee "$ROOT_RUN/outputs/sanity.txt"

      - name: Full-model CUDA benchmark
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_full_model_benchmark.py \
            --device cuda --warmup 20 --iters 100 --repeats 5 \
            --output "$ROOT_RUN/outputs/full_model_cuda.json"

      - name: Full-model CPU benchmark
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_full_model_benchmark.py \
            --device cpu --threads 4 --warmup 10 --iters 30 --repeats 5 \
            --output "$ROOT_RUN/outputs/full_model_cpu4.json"

      - name: ONNX export smoke before training
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_export_smoke.py \
            --output-dir "$ROOT_RUN/outputs/onnx_untrained" \
            | tee "$ROOT_RUN/outputs/onnx_untrained.txt"

      - name: Train 5-epoch smoke
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/train.py

      - name: Locate smoke best checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BEST=$(ROOT="$ROOT_RUN" "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ROOT'])
          files = list(root.glob('runs/*/weights/best.pt'))
          if not files:
              raise SystemExit(f'No best.pt under {root}/runs')
          print(max(files, key=lambda p: p.stat().st_mtime))
          PY
          )
          test -f "$BEST"
          echo "BEST=$BEST" >> "$GITHUB_ENV"
          echo "Found: $BEST"

      - name: Evaluate 5-epoch smoke
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/eval_screening.py \
            --weights "$BEST" \
            --output "$ROOT_RUN/outputs/edge27_spr_v2_5e_eval.json"

      - name: ONNX export smoke after training
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_export_smoke.py \
            --weights "$BEST" \
            --output-dir "$ROOT_RUN/outputs/onnx_trained" \
            | tee "$ROOT_RUN/outputs/onnx_trained.txt"

      - name: Save compact integration report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          cp "$ROOT_RUN/outputs/sanity.txt" "$REPORT_DIR/sanity.txt"
          cp "$ROOT_RUN/outputs/full_model_cuda.json" "$REPORT_DIR/full_model_cuda.json"
          cp "$ROOT_RUN/outputs/full_model_cpu4.json" "$REPORT_DIR/full_model_cpu4.json"
          cp "$ROOT_RUN/outputs/onnx_untrained.txt" "$REPORT_DIR/onnx_untrained.txt"
          cp "$ROOT_RUN/outputs/onnx_trained.txt" "$REPORT_DIR/onnx_trained.txt"
          cp "$ROOT_RUN/outputs/edge27_spr_v2_5e_eval.json" "$REPORT_DIR/eval_5e.json"

          RESULTS=$(ROOT="$ROOT_RUN" "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import os
          files = list(Path(os.environ['ROOT']).glob('runs/*/results.csv'))
          if not files:
              raise SystemExit('No results.csv found')
          print(max(files, key=lambda p: p.stat().st_mtime))
          PY
          )
          cp "$RESULTS" "$REPORT_DIR/results_5e.csv"

          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import json
          root = Path('reports/yoloedge27/stage1/sprdown_v2/integration_5e')
          cuda = json.loads((root/'full_model_cuda.json').read_text())
          cpu = json.loads((root/'full_model_cpu4.json').read_text())
          ev = json.loads((root/'eval_5e.json').read_text())
          summary = {
              'purpose': 'integration/export/trainability smoke only; not a paper accuracy result',
              'cuda_ratios': cuda['ratios'],
              'cpu4_ratios': cpu['ratios'],
              'eval_5e': ev,
          }
          (root/'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record SPR-Down v2 integration and 5e smoke"
            git push origin HEAD:research/yoloedge27-sprdown-v2
          fi
