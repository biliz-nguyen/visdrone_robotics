name: YOLOEdge27 H1 50e Fair Control

on:
  push:
    branches:
      - research/yoloedge27-h1-50e-control
    paths:
      - .github/workflows/yoloedge27-h1-50e-control.yml
      - scripts/run_h1_50e_control.py
  workflow_dispatch:

concurrency:
  group: yoloedge27-h1-50e-control
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  h1-50e-control:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage9/h1_50e_control
      REPORT_DIR: reports/yoloedge27/stage9/h1_50e_control
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout H1 50e research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-h1-50e-control
          fetch-depth: 0

      - name: Verify frozen H1 control and references
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_head_direct_r1' config/experiment.yaml
          grep -q 'H1_50E_SUMMARY_JSON=' scripts/run_h1_50e_control.py
          grep -q 'test_dev_used' scripts/run_h1_50e_control.py
          test -f reports/yoloedge27/stage3/head_snr_v1_5e/summary.json
          test -f reports/yoloedge27/stage8/neck_realloc_v2_50e/neck_realloc_v2_50e_eval.json
          test -f reports/yoloedge27/stage8/neck_realloc_v2_50e/complexity_preflight.json
          "$PYTHON_BIN" -m py_compile scripts/run_h1_50e_control.py scripts/sanity.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"
          test -d "$DATASET/VisDrone2019-DET-test-dev/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert ultralytics.__version__ == '8.4.56'
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_neck_realloc.py

      - name: Train and evaluate frozen H1 50e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_h1_50e_control.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 50 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact H1 50e reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-h1-50e-control"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "variant=H1 standard neck direct reg1 fair 50e control"
            echo "base=S1 SPR P4->P5"
            echo "neck=standard P2:128 P3:256 P4:512 nominal"
            echo "reg_max=1"
            echo "epochs=50"
            echo "seed=42"
            echo "pretrained=false"
            echo "attention=none"
            echo "assignment=stock TAL"
            echo "note=local same-protocol control for N2b 50e; no test-dev evaluation"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No H1 50e report changes to commit"
            exit 0
          fi
          git commit -m "Record H1 50e fair control"
          git pull --rebase origin research/yoloedge27-h1-50e-control
          git push origin HEAD:research/yoloedge27-h1-50e-control
