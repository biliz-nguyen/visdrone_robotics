name: YOLOEdge27 Paper Ablation A1 SPR 100e

on:
  push:
    branches:
      - research/yoloedge27-paper-ablation-100e
    paths:
      - '.github/workflows/yoloedge27-paper-ablation-a1-spr-100e.yml'
      - 'scripts/run_paper_ablation_phase_100e.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a1-spr-reg16-100e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 1440
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage25/paper_ablation_100e
      REPORT_DIR: reports/yoloedge27/stage25/paper_ablation_100e/a1_spr
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout paper 100e branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-paper-ablation-100e
          fetch-depth: 0

      - name: Verify A1-only scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ultralytics_tag: "v8.4.56"' config/experiment.yaml
          grep -q 'edge27_spr_p4p5:' config/experiment.yaml
          "$PYTHON_BIN" -m py_compile scripts/run_paper_ablation_phase_100e.py

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT/a1_spr"
          mkdir -p "$SCREEN_ROOT" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/bootstrap/runs"
          state_dir: "$SCREEN_ROOT/bootstrap/state"
          outputs_dir: "$SCREEN_ROOT/bootstrap/outputs"
          generated_dir: "$SCREEN_ROOT/bootstrap/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh

      - name: Unit test SPR
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py

      - name: Preflight A1 SPR reg16 100e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_100e.py \
            --variant a1_spr \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 100 --batch 8 --nbs 16 --workers 4 \
            --preflight-only

      - name: Train A1 SPR reg16 100e
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_paper_ablation_phase_100e.py \
            --variant a1_spr \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 100 --batch 8 --nbs 16 --workers 4

      - name: Commit A1 100e report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-paper-ablation-100e"
            echo "run_scope=A1_only"
            echo "A1=SPR_P4_P5_standard_neck_reg16"
            echo "epochs=100"
            echo "seed=42"
            echo "pretrained=false"
            echo "AConv=false"
            echo "C12=false"
          } > "$REPORT_DIR/workflow_meta.txt"
          git checkout -- config/experiment.yaml || true
          rm -f config/local.yaml
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record A1 SPR 100e paper ablation"
          git pull --rebase origin research/yoloedge27-paper-ablation-100e
          git push origin HEAD:research/yoloedge27-paper-ablation-100e
