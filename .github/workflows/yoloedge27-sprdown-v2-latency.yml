name: YOLOEdge27 SPR-Down v2 Latency Gate

on:
  push:
    branches:
      - research/yoloedge27-sprdown-v2
    paths:
      - .github/workflows/yoloedge27-sprdown-v2-latency.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latency-gate:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      REPORT_DIR: reports/yoloedge27/stage1/sprdown_v2_latency

    steps:
      - name: Checkout v2 research branch
        uses: actions/checkout@v4

      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY

      - name: Unit tests for SPR-Down v1 and v2
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_sprdown_v2.py

      - name: CUDA latency gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          "$PYTHON_BIN" scripts/sprdown_v2_benchmark.py \
            --device cuda \
            --warmup 100 \
            --iters 500 \
            --repeats 9 \
            --output-json "$REPORT_DIR/cuda.json" \
            --output-md "$REPORT_DIR/cuda.md"

      - name: CPU latency screening
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_benchmark.py \
            --device cpu \
            --threads 4 \
            --warmup 30 \
            --iters 150 \
            --repeats 7 \
            --output-json "$REPORT_DIR/cpu.json" \
            --output-md "$REPORT_DIR/cpu.md"

      - name: Summarize latency gate
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/yoloedge27/stage1/sprdown_v2_latency')
          cuda = json.loads((root / 'cuda.json').read_text())
          cpu = json.loads((root / 'cpu.json').read_text())
          lines = [
              '# SPR-Down v2 combined latency gate',
              '',
              f"CUDA verdict: **{cuda['verdict']['status']}** — {cuda['verdict']['reason']}",
              f"CPU verdict: **{cpu['verdict']['status']}** — {cpu['verdict']['reason']}",
              '',
              'Primary site: P4->P5 (128->256, 40x40).',
              '',
              '> CUDA is the primary local architecture-screening gate. CPU here is an x86 local screening result only; final edge evidence must be measured on the exact Raspberry Pi 5 export.',
              '',
          ]
          (root / 'README.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit benchmark report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record SPR-Down v2 latency gate"
            git push origin HEAD:research/yoloedge27-sprdown-v2
          else
            echo "No benchmark report changes to commit."
          fi
