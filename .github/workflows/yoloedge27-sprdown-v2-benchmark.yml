name: YOLOEdge27 SPR-Down v2 Benchmark

on:
  push:
    branches:
      - research/yoloedge27-sprdown-v2
    paths:
      - .github/workflows/yoloedge27-sprdown-v2-benchmark.yml
      - src/sprdown_v2.py
      - scripts/sprdown_v2_benchmark.py
      - tests/test_sprdown_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latency-gate:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      REPORT_DIR: reports/yoloedge27/stage1/sprdown_v2

    steps:
      - name: Checkout v2 research branch
        uses: actions/checkout@v4

      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          print('CPU threads:', torch.get_num_threads())
          PY
          nvidia-smi

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q tests/test_sprdown.py tests/test_sprdown_v2.py

      - name: CUDA latency gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          "$PYTHON_BIN" scripts/sprdown_v2_benchmark.py \
            --device cuda \
            --warmup 50 \
            --iters 300 \
            --repeats 7 \
            --output-json "$REPORT_DIR/cuda.json" \
            --output-md "$REPORT_DIR/cuda.md"

      - name: CPU latency gate single-thread
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_benchmark.py \
            --device cpu \
            --threads 1 \
            --warmup 30 \
            --iters 150 \
            --repeats 7 \
            --output-json "$REPORT_DIR/cpu_1t.json" \
            --output-md "$REPORT_DIR/cpu_1t.md"

      - name: CPU latency gate four-thread
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/sprdown_v2_benchmark.py \
            --device cpu \
            --threads 4 \
            --warmup 30 \
            --iters 150 \
            --repeats 7 \
            --output-json "$REPORT_DIR/cpu_4t.json" \
            --output-md "$REPORT_DIR/cpu_4t.md"

      - name: Build decision summary
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import json

          root = Path('reports/yoloedge27/stage1/sprdown_v2')
          files = {
              'cuda': root / 'cuda.json',
              'cpu_1t': root / 'cpu_1t.json',
              'cpu_4t': root / 'cpu_4t.json',
          }

          rows = []
          payload = {}
          for name, path in files.items():
              data = json.loads(path.read_text())
              primary = next(x for x in data['results'] if x['name'] == 'P4_to_P5')
              q = primary['ratios']
              verdict = data['verdict']
              rows.append((name, verdict['status'], q['v1_over_conv'], q['v2_over_conv'], q['v2_over_v1']))
              payload[name] = {
                  'status': verdict['status'],
                  'v1_over_conv': q['v1_over_conv'],
                  'v2_over_conv': q['v2_over_conv'],
                  'v2_over_v1': q['v2_over_v1'],
              }

          cuda_ratio = payload['cuda']['v2_over_v1']
          cpu_ratio = payload['cpu_4t']['v2_over_v1']

          if cuda_ratio <= 0.80 and cpu_ratio <= 0.80:
              overall = 'INTEGRATE_SHORT_SMOKE'
              next_step = 'Integrate SPRDownV2 into the YOLO builder and run only 1-5 epochs before any 50e run.'
          elif cuda_ratio < 1.0 and cpu_ratio < 1.0:
              overall = 'BORDERLINE'
              next_step = 'Keep v2 as candidate; inspect full-model/export latency before training 50e.'
          else:
              overall = 'REDESIGN'
              next_step = 'Do not train v2; redesign phase reassembly because the latency objective was not met.'

          summary = {
              'overall': overall,
              'next_step': next_step,
              'target_site': 'P4_to_P5',
              'devices': payload,
          }
          (root / 'decision.json').write_text(json.dumps(summary, indent=2) + '\n')

          lines = [
              '# SPR-Down v2 benchmark decision',
              '',
              f'**Overall:** `{overall}`',
              '',
              next_step,
              '',
              '| Device | Gate | v1/Conv | v2/Conv | v2/v1 |',
              '|---|---|---:|---:|---:|',
          ]
          for name, status, v1c, v2c, v21 in rows:
              lines.append(f'| {name} | {status} | {v1c:.3f} | {v2c:.3f} | {v21:.3f} |')
          lines += [
              '',
              '> Local micro-benchmark only. Final edge claims require the exact final checkpoint on Raspberry Pi 5.',
              '',
          ]
          (root / 'decision.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Commit compact benchmark report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record SPR-Down v2 latency gate"
            git push origin HEAD:research/yoloedge27-sprdown-v2
          fi
