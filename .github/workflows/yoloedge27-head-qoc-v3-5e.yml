name: YOLOEdge27 QOC Head v3 5e

on:
  push:
    branches:
      - research/yoloedge27-head-qoc-v3
    paths:
      - .github/workflows/yoloedge27-head-qoc-v3-5e.yml
  workflow_dispatch:

concurrency:
  group: yoloedge27-head-qoc-v3-5e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qoc-v3-head-5e:
    runs-on: [self-hosted, Linux, X64, gpu, rtx4060ti, visdrone]
    timeout-minutes: 240
    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHON_BIN: /home/minh/miniconda3/envs/torch251/bin/python
      DATASET: /home/minh/Desktop/project/visdrone_local_project/dataset
      SCREEN_ROOT: /home/minh/yoloedge27_experiments/stage3/head_qoc_v3_5e
      REPORT_DIR: reports/yoloedge27/stage3/head_qoc_v3_5e
      PYTHONPATH: ${{ github.workspace }}/third_party/ultralytics:${{ github.workspace }}

    steps:
      - name: Checkout QOC v3 research branch
        uses: actions/checkout@v4
        with:
          ref: research/yoloedge27-head-qoc-v3
          fetch-depth: 0

      - name: Verify midpoint tiny-aware mechanism and reused controls
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          grep -q 'edge27_head_qoc_v3' config/experiment.yaml
          grep -q 'qoc_tiny_threshold: 16.0' config/experiment.yaml
          grep -q 'qoc_tiny_margin_bonus: 0.05' config/experiment.yaml
          grep -q 'adaptive_qoc_margin' src/qoc_loss.py
          grep -q 'test_q3_midpoint_margin_is_exact_and_continuous' tests/test_qoc_head.py
          test -f reports/yoloedge27/stage3/head_qoc_v2_5e/summary.json
          echo 'H0/H1/Q1/Q2 results exist and will be reused; only Q3 will train.'

      - name: Pre-flight GPU and dataset
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          "$PYTHON_BIN" - <<'PY'
          import torch
          print('Torch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          print('CUDA available:', torch.cuda.is_available())
          assert torch.cuda.is_available()
          print('GPU:', torch.cuda.get_device_name(0))
          PY
          test -d "$DATASET/VisDrone2019-DET-train/images"
          test -d "$DATASET/VisDrone2019-DET-val/images"

      - name: Bootstrap local config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCREEN_ROOT"
          mkdir -p "$SCREEN_ROOT/runs" "$SCREEN_ROOT/state" "$SCREEN_ROOT/outputs" "$SCREEN_ROOT/generated" "$REPORT_DIR"
          cat > config/local.yaml <<EOF
          dataset_root: "$DATASET"
          dataset_format: "visdrone_official"
          train_images: "VisDrone2019-DET-train/images"
          train_annotations: "VisDrone2019-DET-train/annotations"
          val_images: "VisDrone2019-DET-val/images"
          val_annotations: "VisDrone2019-DET-val/annotations"
          test_images: "VisDrone2019-DET-test-dev/images"
          test_annotations: "VisDrone2019-DET-test-dev/annotations"
          test_image: ""
          runs_dir: "$SCREEN_ROOT/runs"
          state_dir: "$SCREEN_ROOT/state"
          outputs_dir: "$SCREEN_ROOT/outputs"
          generated_dir: "$SCREEN_ROOT/generated"
          EOF

      - name: Setup pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$PYTHON_BIN" bash setup_local.sh
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          import ultralytics
          expected = (Path.cwd() / 'third_party' / 'ultralytics').resolve()
          print('Ultralytics:', ultralytics.__version__)
          print('Source:', ultralytics.__file__)
          assert Path(ultralytics.__file__).resolve().is_relative_to(expected)
          PY

      - name: Unit tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q \
            tests/test_sprdown.py \
            tests/test_qoc_head.py

      - name: Train only Q3 and compare with reused H0 H1 Q1 Q2
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/run_qoc_v3_test.py \
            --dataset "$DATASET" \
            --screen-root "$SCREEN_ROOT" \
            --report-dir "$REPORT_DIR" \
            --epochs 5 \
            --batch 8 \
            --nbs 16 \
            --workers 4

      - name: Commit compact QOC v3 reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "branch=research/yoloedge27-head-qoc-v3"
            echo "head=$(git rev-parse HEAD)"
            echo "screen_root=$SCREEN_ROOT"
            echo "controls=H0,H1,Q1,Q2 reused; NOT retrained"
            echo "new_variant=Q3 only"
            echo "epochs=5"
            echo "backbone=S1 SPR P4->P5"
            echo "assignment=standard_TAL"
            echo "head=H1 direct-r1; inference unchanged"
            echo "training_extra=midpoint tiny-aware continuous-margin QOC"
            echo "tiny_threshold_px=16"
            echo "base_margin=0.05"
            echo "tiny_margin_bonus=0.05"
            echo "note=local screening only; checkpoints remain runner-local"
          } > "$REPORT_DIR/workflow_meta.txt"

          git checkout -- config/experiment.yaml || true
          git status --short
          git config user.name "yoloedge27-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No QOC v3 report changes to commit"
            exit 0
          fi
          git commit -m "Record QOC head v3 5e screening"
          git pull --rebase origin research/yoloedge27-head-qoc-v3
          git push origin HEAD:research/yoloedge27-head-qoc-v3
