# ============================================================
# EXPERIMENT CONFIG
# Main switch: change only `preset` for normal experiments.
# ============================================================

preset: "reg4_eca"

ultralytics_tag: "v8.4.56"

presets:
  baseline:
    backbone_down: "conv"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  reg8:
    backbone_down: "aconv"
    reg_max: 8
    loss_mode: "hybrid_nwd"
    attention: "none"

  reg4:
    backbone_down: "aconv"
    reg_max: 4
    loss_mode: "hybrid_nwd"
    attention: "none"

  reg4_eca:
    backbone_down: "aconv"
    reg_max: 4
    loss_mode: "hybrid_nwd"
    attention: "eca"

  reg4_ca:
    backbone_down: "aconv"
    reg_max: 4
    loss_mode: "hybrid_nwd"
    attention: "ca"

  reg4_rlca:
    backbone_down: "aconv"
    reg_max: 4
    loss_mode: "hybrid_nwd"
    attention: "rlca"

# -------------------------
# Train protocol
# -------------------------
train:
  imgsz: 640
  epochs: 50       # screening=50, final=100
  batch: 16
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 10
  max_det: 500

  # Fair augmentation protocol
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

# -------------------------
# Reproducibility
# -------------------------
seed: 42
pretrained: false

# -------------------------
# Hybrid loss
# -------------------------
nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

# -------------------------
# Attention
# -------------------------
attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

# -------------------------
# Export defaults
# -------------------------
export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
