# ============================================================
# YOLOEdge27 — Q1 RESEARCH TRACK / HEAD QUALITY STUDY
# Confirmed backbone: one SPR-Down at P4->P5 (S1).
# Existing S1/H1/Q1/Q2 controls are reused; they are NOT retrained here.
# ============================================================

preset: "edge27_head_qoc_v3"

ultralytics_tag: "v8.4.56"

presets:
  edge27_place_b0:
    study: "placement"
    backbone_down: "conv"
    spr_placements: []
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p3p4:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p2p3:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p3p4_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p2p3_p3p4:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_p2p3_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_spr_all:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  # H1: DFL-free efficiency control.
  edge27_head_direct_r1:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"

  edge27_head_snr_16_8_4:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "stride_reg"
    head_reg_bins: [16, 8, 4]

  edge27_head_hybrid_16_4_1:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "stride_reg"
    head_reg_bins: [16, 4, 1]

  # Q1: fixed-margin QOC control.
  edge27_head_qoc_v1:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "quality_overconfidence"
    qoc_lambda: 0.25
    qoc_margin: 0.05
    qoc_tiny_threshold: 16.0
    qoc_tiny_margin_bonus: 0.0

  # Q2 endpoint: stronger tiny tolerance (+0.10 at min-side -> 0 px).
  edge27_head_qoc_v2:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "quality_overconfidence"
    qoc_lambda: 0.25
    qoc_margin: 0.05
    qoc_tiny_threshold: 16.0
    qoc_tiny_margin_bonus: 0.10

  # Q3: midpoint interpolation between Q1 and Q2.
  # Same continuous tiny-aware rule, but +0.05 maximum bonus. This directly
  # tests whether Q2's target-class recovery can be retained while recovering
  # Q1's stronger aggregate calibration gain.
  edge27_head_qoc_v3:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "quality_overconfidence"
    qoc_lambda: 0.25
    qoc_margin: 0.05
    qoc_tiny_threshold: 16.0
    qoc_tiny_margin_bonus: 0.05

train:
  imgsz: 640
  epochs: 50
  batch: 8
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 10
  max_det: 500

  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

seed: 42
pretrained: false

nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
