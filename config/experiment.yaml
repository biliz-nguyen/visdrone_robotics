# ============================================================
# YOLOEdge27 — Q1 RESEARCH TRACK / STAGE 1
# Goal: isolate SPR-Down against a clean YOLO-derived baseline.
# Legacy AConv / NWD / attention components are intentionally NOT used.
# ============================================================

preset: "edge27_spr_v2"

ultralytics_tag: "v8.4.56"

presets:
  edge27_baseline:
    backbone_down: "conv"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_v1:
    backbone_down: "sprdown"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_v2:
    backbone_down: "sprdown_v2"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

# -------------------------
# Stage-1 fair train protocol
# Kaggle-oriented: same optimization settings for baseline and SPR-Down.
# -------------------------
train:
  imgsz: 640
  epochs: 50
  batch: 16
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 10
  max_det: 500

  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

seed: 42
pretrained: false

nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
