# ============================================================
# YOLOEdge27 — Q1 RESEARCH TRACK / STAGE 2 REDESIGN
# Goal: compare tiny-adaptive TAL quality schedules on top of SPR-Down v1.
# Legacy AConv / NWD / attention and TCR recovery are intentionally NOT active.
# ============================================================

preset: "edge27_spr_taq_v2"

ultralytics_tag: "v8.4.56"

presets:
  edge27_baseline:
    backbone_down: "conv"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    assigner_mode: "standard"

  edge27_spr_v1:
    backbone_down: "sprdown"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    assigner_mode: "standard"

  edge27_spr_tcr_v1:
    backbone_down: "sprdown"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    assigner_mode: "tiny_recovery"

  edge27_spr_taq_v1:
    backbone_down: "sprdown"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    assigner_mode: "tiny_quality"
    tiny_quality_assigner:
      tiny_min_side: 16.0
      beta_floor: 4.0

  edge27_spr_taq_v2:
    backbone_down: "sprdown"
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    assigner_mode: "tiny_quality"
    tiny_quality_assigner:
      tiny_min_side: 16.0
      beta_floor: 5.0

# -------------------------
# Fair train protocol
# Same optimizer/augmentation as Stage 1. Only assignment ranking changes.
# -------------------------
train:
  imgsz: 640
  epochs: 50
  batch: 8
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 10
  max_det: 500

  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

# Historical TCR config retained only so old preset remains reproducible.
tiny_assigner:
  tiny_min_side: 16.0
  min_candidates: 4

# Default TAQ config. TAQ v1/v2 override this inside their presets above.
tiny_quality_assigner:
  tiny_min_side: 16.0
  beta_floor: 5.0

# -------------------------
# Reproducibility
# -------------------------
seed: 42
pretrained: false

# Retained only for shared config schema; NOT active in Stage 2.
nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

# Retained only for shared builder schema; attention is disabled in Stage 2.
attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

# -------------------------
# Export defaults
# -------------------------
export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
