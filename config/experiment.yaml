# ============================================================
# YOLOEdge27 — Q1 RESEARCH TRACK / SPR-DOWN PLACEMENT ABLATION
# Goal: isolate where SPR-Down is useful in the backbone.
# Assignment, loss, head, attention, and reg_max are frozen.
# ============================================================

preset: "edge27_spr_p4p5"

ultralytics_tag: "v8.4.56"

# Placement names refer to the three backbone reductions after P2:
#   p2_p3: P2 -> P3 (layer 3)
#   p3_p4: P3 -> P4 (layer 5)
#   p4_p5: P4 -> P5 (layer 7)
# The eight presets below exhaust all 2^3 Conv/SPR placement combinations.
presets:
  edge27_place_b0:
    backbone_down: "conv"
    spr_placements: []
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p4p5:
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p3p4:
    backbone_down: "sprdown"
    spr_placements: ["p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p2p3:
    backbone_down: "sprdown"
    spr_placements: ["p2_p3"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p3p4_p4p5:
    backbone_down: "sprdown"
    spr_placements: ["p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p2p3_p3p4:
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_p2p3_p4p5:
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

  edge27_spr_all:
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"

# -------------------------
# Fair placement-screen protocol
# The workflow overrides epochs/batch only for the approved local 5e screen.
# Everything else remains identical across all eight variants.
# -------------------------
train:
  imgsz: 640
  epochs: 50
  batch: 16
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 10
  max_det: 500

  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

seed: 42
pretrained: false

# Retained only for shared config schema; NOT active in placement screening.
nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

# Retained only for shared builder schema; attention is disabled here.
attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
