# ============================================================
# YOLOEdge27 — Q1 RESEARCH TRACK
# C1: one SPR-Down at P4->P5 (S1).
# C2: frozen N2b neck allocation 160/256/416 nominal.
# C3-v1: Tiny-Supervision Calibration (TSC), training-only.
# ============================================================

preset: "edge27_c3_tsc_v1"

ultralytics_tag: "v8.4.56"

presets:
  edge27_place_b0:
    study: "placement"
    backbone_down: "conv"
    spr_placements: []
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p3p4:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p2p3:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p3p4_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p2p3_p3p4:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_p2p3_p4p5:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_spr_all:
    study: "placement"
    backbone_down: "sprdown"
    spr_placements: ["p2_p3", "p3_p4", "p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_head_direct_r1:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "standard"

  edge27_neck_rep_v1:
    study: "neck"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "rep"

  # N2: fixed fine-scale-biased capacity reallocation.
  edge27_neck_realloc_v1:
    study: "neck"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "realloc"
    neck_channels_nominal:
      p2: 160
      p3: 256
      p4: 384

  # C2/N2b: frozen budget-constrained resolution-aware allocation.
  # 448 was rejected before training for exceeding the 1.03x-H1 FLOPs budget.
  edge27_neck_realloc_v2:
    study: "neck"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "realloc"
    neck_channels_nominal:
      p2: 160
      p3: 256
      p4: 416

  # C3-v1: keep the entire C1+C2 inference architecture frozen and alter only
  # TAL's post-assignment soft-target amplitude for tiny GTs. Candidate region,
  # top-k ranking, conflict resolution and target boxes remain standard TAL.
  edge27_c3_tsc_v1:
    study: "optimization"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 1
    loss_mode: "standard"
    attention: "none"
    head_mode: "standard"
    neck_mode: "realloc"
    neck_channels_nominal:
      p2: 160
      p3: 256
      p4: 416
    assigner_mode: "tiny_supervision"

  edge27_head_snr_16_8_4:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "stride_reg"
    head_reg_bins: [16, 8, 4]
    neck_mode: "standard"

  edge27_head_hybrid_16_4_1:
    study: "head"
    backbone_down: "sprdown"
    spr_placements: ["p4_p5"]
    reg_max: 16
    loss_mode: "standard"
    attention: "none"
    head_mode: "stride_reg"
    head_reg_bins: [16, 4, 1]
    neck_mode: "standard"

train:
  imgsz: 640
  epochs: 5
  batch: 8
  nbs: 16
  workers: 4

  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.05
  warmup_epochs: 3.0
  cos_lr: true

  amp: true
  deterministic: false
  patience: 0
  save_period: 1
  max_det: 500

  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.10
  scale: 0.35
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

  box: 7.5
  cls: 0.5
  dfl: 1.5

seed: 42
pretrained: false

# Locked C3-v1 setting. Do not tune these values after seeing validation AP.
tiny_supervision:
  tiny_min_side: 16.0
  gamma_floor: 0.5

nwd:
  c: 12.8
  ciou_weight: 0.75
  nwd_weight: 0.25

attention_cfg:
  position: "P2_AFTER_C3K2"
  eca_kernel: 3
  ca_reduction: 32
  ca_min_channels: 8
  rlca_alpha_init: 0.10

export:
  imgsz: 640
  batch: 1
  half: false
  int8: false
  dynamic: false
  onnx_opset: 12
  onnx_simplify: true
